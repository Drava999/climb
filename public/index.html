.fhead{display:flex;align-items:center;gap:10px}
.fhead h1{font-size:24px;margin:0;line-height:1.15}.fhead h2{margin:0}
.fcard{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.flinks{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:6px}
.fcolx{display:flex;flex-direction:column;gap:6px}
.fchip{border:0;border-radius:99px;padding:8px 10px;font:700 12.5px var(--ui);background:var(--raise);color:var(--ink);text-align:center;line-height:1.2}
.fchip.done{background:var(--good-soft);color:var(--good)}.fchip.here,.fchip.progress{background:var(--accent-soft);color:var(--accent-text)}
.fchip.empty,.fchip.ready{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.fme{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:10px 12px;font:800 13px var(--ui);white-space:nowrap}
.farr{color:var(--muted);font-weight:800}
.fnone{font-size:12px;color:var(--muted);text-align:center}
.fcap{display:flex;justify-content:space-between;font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.stair{width:100%;height:auto;display:block}
.st-d{fill:var(--good)}.st-b{fill:var(--accent-soft)}.st-p{fill:var(--accent)}.st-f{fill:var(--bg);stroke:var(--line);stroke-dasharray:4 3}
.st-ck{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.st-t{font:800 13px var(--ui);fill:#fff}.st-t.dk{fill:var(--ink)}.st-me{fill:var(--accent);stroke:var(--surface);stroke-width:4}
.stairl{display:grid;text-align:center;font:700 11.5px var(--ui);color:var(--muted);margin-top:-4px}
.stairl .d{color:var(--good)}.stairl .c{color:var(--accent-text);font-weight:800}
.cdrow{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.cdi{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.cdi.e{background:var(--good);color:#fff}.cdi.p{border:2.5px solid var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}.cdi.n{border:2.5px solid var(--line)}
.crow2{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 0;font:600 15px var(--ui);color:var(--ink);text-align:left;width:100%;min-height:46px}
.crow2:last-child{border-bottom:0}
.cpill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;flex:none}
.cpill.m{background:var(--good-soft);color:var(--good)}.cpill.p{background:var(--accent-soft);color:var(--accent-text)}.cpill.r{background:var(--hook-bg);color:var(--hook-ink)}.cpill.n{background:var(--raise);color:var(--muted)}
.factions{display:flex;flex-direction:column;gap:8px}
.factions .fact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.factions .btn.soft{font-size:15px}
/* combined questions */
.combotag{background:var(--ink);color:var(--bg);font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:99px}
.marktag{background:var(--hook-bg);color:var(--hook-ink);font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:99px}
.brings{background:var(--raise);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bchip{background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.2}
.bchip b{font-size:13.5px}.bchip small{font-size:11px;color:var(--muted);font-weight:600}
main.lesson .prompt.combo{font-size:18px;font-weight:600;line-height:1.5}
.bplus{font:800 16px var(--ui);color:var(--muted)}
/* skills */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{background:var(--surface);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge b{font-size:13px;line-height:1.25}.badge span{font-size:11px;color:var(--muted)}.badge .acc{color:var(--accent-text);font-weight:700}
.badge.off{background:none;border:2px dashed var(--line)}
.radarp{align-items:center}
.radar{width:100%;max-width:420px;height:auto}
.radar .rg1{fill:var(--bg);stroke:var(--line)}.radar .rg2{fill:none;stroke:var(--line)}
.radar .rv1{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}.radar .rd{fill:var(--accent)}
.radar .rl{font:700 12px var(--ui);fill:var(--ink)}.radar .rv{fill:var(--muted);font-weight:600}
/* computer layout */
.legend .ln{width:18px;height:3px;border-radius:2px;background:var(--line)}.legend .ln.good{background:var(--good)}.legend .ln.acc{background:color-mix(in srgb,var(--accent) 50%,var(--surface))}
@media (min-width:1024px){
  .tabbar{top:0;bottom:0;right:auto;width:208px;display:flex;flex-direction:column;gap:4px;padding:24px 14px;border-top:0;border-right:1px solid var(--line)}
  .tabbar::before{content:"Climb";font:800 22px var(--ui);color:var(--ink);padding:0 12px 22px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;font-size:15px}
  .tab.on{background:var(--accent-soft)}
  body:has(.tabbar){padding-left:232px;padding-right:24px}
  body:has(.tabbar) .app{max-width:1180px}
  .screen{padding-bottom:56px}
  .screen:not(.path){max-width:680px;width:100%;margin:0 auto}
  .fab{bottom:32px;right:40px}
  .path.wide .phead{padding-top:20px}
  .path.wide .phead .btn{flex:none;min-height:56px;padding:0 22px;display:flex;align-items:center;gap:10px}
  .path.wide .cswitch{flex:0 1 auto}
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
  .pmain{display:flex;flex-direction:column;gap:16px;min-width:0}
  .pside{position:sticky;top:16px;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto}
  .pside .fcard{padding:0;background:none}
  .pside .why{background:var(--accent-soft)}
  .hwrap{position:relative;overflow-x:auto;padding:4px 2px 8px}
  .hlinks{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
  .hlinks path{fill:none;stroke:var(--line);stroke-width:2.6;stroke-linecap:round}
  .hlinks path.good{stroke:var(--good)}.hlinks path.acc{stroke:color-mix(in srgb,var(--accent) 50%,var(--surface))}
  .hpath{display:grid;gap:40px;position:relative;z-index:1;min-width:min-content}
  .hcol{display:flex;flex-direction:column;gap:14px}
  .hhead{display:flex;flex-direction:column;gap:4px;min-height:132px}
  .hlabel{font:800 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .hcol.done .hlabel{color:var(--good)}.hcol.now .hlabel{color:var(--accent-text)}
  .hhead b{font-size:15.5px;line-height:1.25}
  .hwhy{color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .hcol.now .hwhy{color:var(--ink)}
  .hcol .ptile{min-height:84px}
  .badges{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* ===== v3 warm, phone-native (approved 2026-10-16; guided by impeccable, Emil Kowalski and taste skills) ===== */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--tabh:76px}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
::selection{background:var(--accent-soft);color:var(--ink)}
button,a,.tab,summary{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
input[type=text],input[type=date],textarea{font-size:16px}
.app{max-width:none;width:100%}
.screen{max-width:640px;width:100%;margin:0 auto}
h1{font-weight:900;letter-spacing:-.02em}
h2,h3{font-weight:900}
.num{font-family:var(--ui);font-variant-numeric:tabular-nums}
.stats b{font-family:var(--ui);font-weight:900}
.mask,.vnode .n,.slot .n,.vscale .mk,.vstat b{font-family:var(--ui)}
.vstat b{font-weight:900}
.label,.eyebrow,.lvl,.tag,.hlabel,.fcap,.combotag,.marktag,.tstat.here,.vscale .ends,.stairl{text-transform:none;letter-spacing:0}
.label{font:800 14px/1.3 var(--ui);color:var(--muted)}
.lvl{font-size:13px;font-weight:800}
.combotag,.marktag{font-size:13px;font-weight:800}
.card,.panel{box-shadow:none}
.ptile,.cswitch{box-shadow:none}
.btn{font-weight:800;transition:transform 160ms var(--ease-out),opacity 160ms}
.btn,.ptile,.crow,.grow,.opt,.chip,.pick,.testrow,.swrow,.tab,.roundbtn,.playbtn,.cswitch,.crow2,.fchip,.vnode,.slot,.addf{transition:transform 160ms var(--ease-out),background-color 160ms,border-color 160ms}
.btn:active:not(:disabled),.ptile:active,.crow:active,.grow:active,.opt:active:not(:disabled),.chip:active,.pick:active,.testrow:active:not(:disabled),.swrow:active,.roundbtn:active,.playbtn:active,.cswitch:active,.crow2:active,.fchip:active,.vnode:active,.addf:active{transform:scale(.97)}
.tab:active .ti{transform:scale(.92)}
@media (hover:none){.chip:hover{border-color:var(--line)}.opt:hover:not(:disabled){border-color:var(--line)}.course:hover{border-color:var(--line)}}
.sheet-bg{animation:fadein 200ms ease}
.sheet.pop,.sheet{animation:sheetin 320ms var(--ease-drawer)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.pop{animation:pop 220ms var(--ease-out)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast{border-radius:16px;animation:toastin 240ms var(--ease-out)}
@keyframes toastin{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.pop,.toast,.pop{animation:fadein 150ms ease}.btn:active,.ptile:active,.crow:active,.grow:active,.opt:active,.chip:active{transform:none}}
/* tab bar */
.tabbar{border-top:0;background:var(--surface);padding-top:6px}
.tab{gap:3px;font:700 12px var(--ui);color:var(--muted)}
.tab .ti{display:flex;padding:4px 18px;border-radius:99px;transition:transform 160ms var(--ease-out),background-color 160ms}
.tab.on{color:var(--ink);font-weight:900}
.tab.on .ti{background:var(--accent-soft);color:var(--accent-text)}
.tab.newc{display:none}
.fab{display:none}
/* Today */
.bighead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:14px}
.bighead h1{font-size:32px;line-height:1.05}
.bhsub{font-size:15px;font-weight:700;color:var(--muted)}
.roundbtn{border:0;width:44px;height:44px;border-radius:50%;background:var(--raise);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.week{display:flex;align-items:center;gap:12px}
.wdays{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font:800 12px var(--ui);color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center}
.wd.fut i{opacity:.5}.wd.today{color:var(--ink);font-weight:900}
.wd.on i{background:var(--accent);color:var(--accent-ink)}
.wst{display:flex;flex-direction:column;align-items:flex-end}.wst b{font-size:20px;font-weight:900;line-height:1.1}.wst span{font-size:13px;font-weight:700;color:var(--muted)}
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border-radius:26px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;min-height:300px}
.hero>*{position:relative}
.hero .ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:210px}
.ring text{font-family:var(--ui);font-weight:900}
.hero .hsub:nth-last-of-type(1){text-shadow:none}
.ridge .rf{fill:var(--ridge)}.ridge .rt{fill:none;stroke:var(--accent-ink);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;opacity:.55}
.ridge .rc{fill:var(--accent-ink)}.ridge .rp{stroke:var(--accent-ink);stroke-width:2.5;stroke-linecap:round}.ridge .rflag{fill:var(--accent-ink)}
.hsub{font-size:15px;font-weight:800}
.htitle{font-size:27px;line-height:1.1;letter-spacing:-.02em;max-width:260px}
.hgap{flex:1;min-height:150px}
.hmeta{font-size:15px;font-weight:700;max-width:280px}
.hbtn{margin-top:6px;background:var(--accent-ink);color:var(--accent);font-size:18px;font-weight:900;min-height:54px}
.sech{font-size:20px;padding:4px 4px 0}
.group{background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.group>*+*{border-top:2px solid var(--bg)}
.grow{width:100%;border:0;background:none;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);min-height:64px}
.gico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.gico.acc{background:var(--accent-soft);color:var(--accent-text)}.gico.good{background:var(--good-soft);color:var(--good)}
.gmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.gmid b{font-size:16px;font-weight:800;line-height:1.25}
.gbar{display:block;height:6px;border-radius:99px;background:var(--raise);overflow:hidden}.gbar i{display:block;height:100%;border-radius:99px}.gbar i.acc{background:var(--accent)}.gbar i.good{background:var(--good)}
.gval{font-size:14px;font-weight:800;color:var(--muted)}
.hx0{fill:var(--raise)}.hx1{fill:none;stroke:var(--good);stroke-width:4;stroke-linecap:round}
.tgrid{display:flex;flex-direction:column;gap:16px}.tcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.group .crow{border-radius:0;background:none;min-height:68px}
.crow{background:var(--surface)}
.cico{background:var(--accent-soft);color:var(--accent-text)}
.cst.due{color:var(--accent-text);background:var(--accent-soft)}
.cbar>i{background:var(--accent)}
/* path tweaks */
.why p{margin:0}.why b{color:var(--ink)}
.why{background:var(--hook-bg);color:var(--ink)}
.why.ahead{background:none;border:2px dashed var(--line);color:var(--muted)}
.pnode.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.pstep.now .pline{background:linear-gradient(var(--accent) 45%,var(--line) 45%)}
.ptile.s-here{border-color:var(--accent)}
.tstat.here{background:var(--accent);color:var(--accent-ink)}
.playbtn{background:var(--accent);color:var(--accent-ink)}
.fme{background:var(--accent);color:var(--accent-ink)}
.st-p{fill:var(--accent)}.st-t{fill:var(--accent-ink)}.st-t.dk{fill:var(--ink)}.st-me{fill:var(--accent-text)}
.radar .rv1{fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent-text)}.radar .rd{fill:var(--accent-text)}
.upnext{background:var(--accent);color:var(--accent-ink)}
.phead2{padding-top:14px}
.ptitle{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);width:100%}
.ptitle .pt{display:flex;align-items:center;gap:6px;font:900 30px/1.08 var(--ui);letter-spacing:-.02em}
.ptitle .pt svg{color:var(--muted);flex:none}
.nextstrip{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px}
.nextstrip b{font-size:17px;font-weight:900}.nextstrip span{font-size:14px;font-weight:700}
.nextstrip .playbtn{background:var(--accent-ink);color:var(--accent);width:52px;height:52px;border-radius:16px}
/* graphs */
:root{--g1:#8F5400;--g2:#2C7A57;--g3:#2F63B0;--g4:#A3456B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#F7C25E;--g2:#5DC495;--g3:#8DB4F0;--g4:#EE93B8}}
:root[data-theme="dark"]{--g1:#F7C25E;--g2:#5DC495;--g3:#8DB4F0;--g4:#EE93B8}
.graph{width:100%;max-width:480px;height:auto;align-self:center;display:block;margin:0 auto;overflow:visible}
.gbox{background:var(--surface);border-radius:18px;padding:8px 6px 2px}
main.lesson .gbox{background:var(--surface)}
.gax{stroke:var(--ink);stroke-width:1.6}.gax0{stroke:var(--line);stroke-width:1.2}.ggrid{stroke:var(--line);stroke-width:1}
.gal{font:800 11.5px var(--ui);fill:var(--muted)}.gtk{font:700 11px var(--ui);fill:var(--muted)}.gtk.b{fill:var(--ink);font-weight:900}
.gl{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gline.c1 .gl{stroke:var(--g1)}.gline.c2 .gl{stroke:var(--g2)}.gline.c3 .gl{stroke:var(--g3)}.gline.c4 .gl{stroke:var(--g4)}
.gll{font:900 12px var(--ui)}.gll.c1{fill:var(--g1)}.gll.c2{fill:var(--g2)}.gll.c3{fill:var(--g3)}.gll.c4{fill:var(--g4)}
.gline.old .gl{stroke-dasharray:5 6;opacity:.5}
.gl.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:gdraw 650ms var(--ease-out) forwards}
.gline.old .gl.draw{animation:none;stroke-dashoffset:0;stroke-dasharray:5 6}
@keyframes gdraw{to{stroke-dashoffset:0}}
.ggd{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4}
.gdot{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.gpt.pick{cursor:pointer}.gpt.pick .gdot{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}.ghitc{fill:transparent}
.gpt.ok .gdot{fill:var(--good);stroke:var(--surface)}.gpt.no .gdot{fill:var(--bad);stroke:var(--surface)}
.gpl{font:900 12px var(--ui);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.gll{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.garea{fill:color-mix(in srgb,var(--g1) 24%,transparent)}.garea:nth-of-type(2){fill:color-mix(in srgb,var(--g2) 24%,transparent)}.garea:nth-of-type(3){fill:color-mix(in srgb,var(--g3) 22%,transparent)}.garea:nth-of-type(4){fill:color-mix(in srgb,var(--g4) 22%,transparent)}
.garea.pick{cursor:pointer;stroke:var(--surface);stroke-width:2}
.garea.ok{fill:color-mix(in srgb,var(--good) 45%,transparent)}.garea.no{fill:color-mix(in srgb,var(--bad) 40%,transparent)}
.galbl{font:800 11px var(--ui);fill:var(--ink);pointer-events:none}.galbl.big{font-size:16px;font-weight:900}
.gline.drag{cursor:grab;touch-action:none;transition:transform 220ms var(--ease-out)}.gline.drag.held{transition:none;cursor:grabbing}.gline.drag .gl{stroke-width:4}
.ghit{stroke:transparent;stroke-width:30;fill:none}
.gstep{display:flex;flex-direction:column;gap:10px}.gtext{font-size:16px;line-height:1.45;min-height:46px}
.gnav{display:flex;align-items:center;gap:8px}.gnav span{flex:1}
@media (prefers-reduced-motion:reduce){.gl.draw{animation:none;stroke-dashoffset:0;stroke-dasharray:none}.gline.drag{transition:none}}
/* diagrams + timelines */
.diag{width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
.ds{stroke:var(--ink);stroke-width:1.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.dd{stroke-dasharray:5 4}
.df-soft{fill:var(--raise)}.df-part{fill:color-mix(in srgb,var(--accent) 35%,var(--surface))}.df-green{fill:color-mix(in srgb,var(--g2) 30%,var(--surface))}.df-blue{fill:color-mix(in srgb,var(--g3) 28%,var(--surface))}.df-pink{fill:color-mix(in srgb,var(--g4) 28%,var(--surface))}.df-dark{fill:var(--muted)}.df-none{fill:none}
line.ds,polyline.ds,path.ds{fill:none}
.darh{fill:var(--ink)}

    const dg=g.replace(/\D/g,""), dn=n.replace(/\D/g,""); if((dg||dn) && dg!==dn) return false; // numbers must match exactly here; numCheck handles tolerance
    if(/^[a-z]{2,6}$/.test(g) && n.includes(" ") && g===initials(t)) return true; // "tce" for "time charter equivalent"
    if(n.length>40) return false; // long answers go to the full check
    const gw=g.split(" "), nw=n.split(" "), sing=w=>w.replace(/(es|s)$/,"");
    if(gw.length!==nw.length) return false;
    // only small typos inside each word, so "elastic" never passes for "inelastic", nor "lower" for "higher"
    return gw.every((w,i)=>{ const v=nw[i]; if(w===v||sing(w)===sing(v)) return true; if(w[0]!==v[0]) return false; const d=lev(w,v); return v.length>=5 && d<=1; }); // bigger slips go to the full check
  });
}

function newConcept(id,o){ return {id, name:String(o.name||""), summary:String(o.summary||""), points:Array.isArray(o.points)?o.points.filter(Boolean).map(String).slice(0,4):[], example:String(o.example||""), hook:String(o.hook||""), rung:0, s:0, due:0, seen:0, right:0, bank:null, items:o.items?cleanItems(o.items):undefined, note:o.note?String(o.note).slice(0,300):undefined, needs:strs(o.needs).slice(0,3)}; }
const order = c => c.units.flatMap(u=>u.concepts).filter(id=>c.concepts[id]);
function progress(c){ const ids=order(c); if(!ids.length) return 0; return Math.round(ids.reduce((s,id)=>s+c.concepts[id].rung,0)/(ids.length*5)*100); }
function accuracy(c){ const a=c.acc||[]; return a.length>=4 ? a.reduce((s,x)=>s+x,0)/a.length : null; }
function dueCount(c){ const now=Date.now(); return order(c).filter(id=>{const k=c.concepts[id]; return k.rung>0&&k.due<=now;}).length; }
function newCount(c){ return order(c).filter(id=>c.concepts[id].rung===0).length; }

LEARNER: ${levelText(o.level)}
GOAL OR CONTEXT: ${o.goal||"none given"}
${o.focus?`FOCUS: ${o.focus}`:""}
${o.notes?`SOURCE MATERIAL (stay faithful to it):\n"""${o.notes.slice(0,40000)}"""`:""}

${examTxt ? examTxt+"\nFor this language exam, units follow the syllabus themes and skills, and each concept teaches vocabulary, phrases or sentence patterns the exam expects." : "Build 3 units of 4 concepts. Units are real-life situations or skills in a sensible order (for a beginner: greetings and introductions, numbers and prices, ordering food, and so on)."}
Each concept is something the learner will be able to SAY or UNDERSTAND, named in English (e.g. "Say hello and goodbye"), and teaches 4-6 high-frequency, natural words or short phrases ("items"). Later concepts reuse earlier words where natural.

Also suggest 5 "angles": other situations or skills to branch into later (2-5 words each).
Accuracy matters: correct script, spelling and tones; phrasing a native speaker would actually use.
Return ONLY JSON: {"language":{"name":"e.g. Mandarin Chinese","code":"BCP-47 code, e.g. zh-CN","roman":"name of the romanisation system, or \\"\\""},"title": course title (max 5 words),"angles":[""],"units":[{"title":"","concepts":[{"name":"","summary":"","note":"","items":[{"t":"","r":"","m":""}]}]}]}`;
}
function setLanguage(c, lg, topic){
  lg = lg || {};
  c.kind = "language";
  c.language = { name:String(lg.name||topic||"Language"), code:/^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$/.test(lg.code||"") ? lg.code : "en", roman:String(lg.roman||"") };
}
async function genLangBank(c, ids){
  const cons = ids.map(id=>c.concepts[id]);
  const known = knownItems(c, cons).slice(0,150);
  const lang = c.language, zh = /^zh/.test(lang.code);
  const prompt = `Write practice material for a ${lang.name} course called "${c.title}", for a learner who is a ${levelText(c.level)}.
Words and phrases the learner already knows: ${known.join("; ")||"none yet"}.
Use those plus each concept's own items, and only very common grammar words beyond them. Pitch vocabulary at the level named in the course title if any (e.g. HSK 1, CEFR A2).${zh?" Write pinyin as HSK textbooks do, with tone sandhi (不是 bú shì, 一个 yí gè), the same way everywhere. Sentences are 4-12 characters.":""} This is a language course: house-style rules on analogies, thinking moves and calculations don't apply.
Write material for ONLY these concepts:
${cons.map((k,i)=>`${i+1}. ${k.name}: ${k.summary} Items: ${(k.items||[]).map(x=>`${x.t}${x.r?" ("+x.r+")":""} = ${x.m}`).join("; ")}`).join("\n")}

For each concept:
- "sentences": 3 short, natural sentences (3-8 words) using this concept's items. Each {"t": target script, "r": ${lang.roman||"romanisation, or \"\" for Latin-script languages"}, "m": English meaning, "tiles": the sentence split into 3-7 word tiles in the target script, whole words only, no punctuation, "alt": any OTHER fully correct orders of the same tiles as strings (prefer sentences with only one natural order)}.
- "dialogue": a realistic 2-4 line exchange using the items: [{"s":"A" or "B","t":"","r":"","m":""}].
- "respond": 2 situations: {"situation": short English setup saying who you're talking to and what you want to say, "line": what they say to you {"t","r","m"}, "options": 3 possible replies [{"t","r","m"}], exactly one right and two plausible but wrong in meaning, "answer": index of the right reply}.
- "translate": 2 short English sentences for the learner to say in ${lang.name}, each {"m": English, "t": target, "r": romanisation}, using known words plus this concept's items.
Accuracy matters: correct script${zh?", characters and tone marks":" and spelling"}, and phrasing a native speaker would actually use.
Return ONLY JSON: {"items":[{"name": concept name exactly as given, "sentences":[], "dialogue":[], "respond":[], "translate":[]}]}`;
  const {data:out, writer} = await writerJson(prompt);
  const items = (out&&out.items)||[];
  const tx = x => x && x.t ? {t:String(x.t).trim(), r:String(x.r||"").trim(), m:String(x.m||"").trim()} : null;
  cons.forEach((k,i)=>{
    const it = items.find(x=>x&&norm(x.name)===norm(k.name)) || items[i]; if(!it) return;
    const sentences = arrOf(it.sentences).map(s=>{ const b=tx(s); if(!b||!b.m) return null; b.tiles = strs(s.tiles).map(t=>t.trim()).filter(Boolean).slice(0,8); b.alt = strs(s.alt).slice(0,3); return b; }).filter(Boolean);
    const dialogue = arrOf(it.dialogue).map(d=>{ const b=tx(d); if(b) b.s=String(d.s||""); return b; }).filter(Boolean).slice(0,6);
    const respond = arrOf(it.respond).filter(r=>r&&r.line&&Array.isArray(r.options)).map(r=>({situation:String(r.situation||""), line:tx(r.line), options:r.options.map(tx).filter(Boolean).slice(0,3), answer:Math.max(0,parseInt(r.answer)||0)})).filter(r=>r.line&&r.options.length>=2&&r.answer<r.options.length);
    const translate = arrOf(it.translate).map(tx).filter(x=>x&&x.m);
    if(!sentences.length && !respond.length) return;
    k.lang = {sentences, dialogue, respond, translate};
    k.bank = {v:2, mcq:[], tf:[], cloze:[], recall:[], apply:[], connect:[], langOnly:true}; k.qv=QSTYLE;
    k.writer = writer;
  });
  saveCourse(c);
}
async function addLangBranch(c, o){
  const ask = o.ask ? o.ask : o.parent ? `Write a BRANCH going deeper into "${o.parent.name}": 4 concepts with more advanced or alternative ways to say these things.`
    : o.angle ? `Write a BRANCH about this situation or skill: "${o.angle}". 4 concepts.` : `Write the NEXT unit: 4 new practical concepts that build on what has been taught.`;
  const prompt = `You are extending a ${c.language.name} course called "${c.title}" for a learner who is a ${levelText(c.level)}.
Concepts so far: ${order(c).map(id=>c.concepts[id].name).join("; ")}.
Words taught so far: ${order(c).flatMap(id=>(c.concepts[id].items||[]).map(x=>x.t)).slice(0,150).join(", ")}.
${ask} Each concept teaches 4-6 new, natural, high-frequency items and reuses earlier words where natural. Item: "t" target script, "r" ${c.language.roman||"romanisation"} ("" for Latin-script languages), "m" English meaning. Correct script, spelling and tones.
Return ONLY JSON: {"title": unit title (max 5 words), "concepts":[{"name": what the learner can say or understand (English, 2-5 words), "summary": one sentence, "note": one short tip, max 30 words, "items":[{"t":"","r":"","m":""}]}]}`;
  const {data:out} = await writerJson(prompt);
  return out;
}

/* language practice */
const LANGQ = new Set(["lhear","lsee","lpick","lbuild","ltype","llisten","lrespond","ltrans"]);
const tilesOf = s => s.tiles && s.tiles.length>=2 ? s.tiles : String(s.t).split(/\s+/).filter(Boolean);
function langType(k, L){
  const c=LS.c, sp=canSpeak(c), d=k.lang||{}, r=Math.random();
  const buildable = (d.sentences||[]).some(s=>tilesOf(s).length>=3);
  if(L<=1) return sp && r<.5 ? "lhear" : "lsee";
  if(L===2) return buildable && r<.55 ? "lbuild" : "lpick";
  if(L===3) return sp && (d.sentences||[]).length && r<.4 ? "llisten" : "ltype";
  if(L===4) return (d.respond||[]).length ? "lrespond" : buildable ? "lbuild" : "ltype";
  return (d.translate||[]).length ? "ltrans" : "ltype";
}
function pickItem(k){
  const items = k.items||[]; k.iseen = k.iseen||{};
  const min = Math.min(...items.map(x=>k.iseen[x.t]||0));
  const it = shuffle(items.filter(x=>(k.iseen[x.t]||0)===min))[0];
  k.iseen[it.t] = (k.iseen[it.t]||0)+1; return it;
}

}
function langTyped(ch, promptHtml, t, o){
  main.innerHTML = head()+`<div class="card pop">${ch}${promptHtml}<div id="hintArea"></div>
    <form id="tform" autocomplete="off"><input type="text" id="tin" placeholder="${esc(o.placeholder)}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></form>

  wireQuit();

  let busy=false;
  const lock = g => { const f=$("tform"); if(f) f.outerHTML = g ? `<div class="yours"><span class="label">You wrote</span><span>${esc(g)}</span></div>` : ""; const i=$("idk"); if(i) i.remove(); };

    const el=$("tin"); if(busy||!el) return; const g=el.value.trim(); if(!g){ el.focus(); return; }
    busy=true; LS.q.typed=g; lock(g);
    if(langMatch(g, [t.t, t.r])){ if(o.after) o.after(); return answered(LS.q.hint?"helped":"right", {answer:answerText, showAns:true}); }

    bar(`<button class="btn block" disabled><span class="spinner"></span> Checking your answer…</button>`);
    try{
      const r = await aiCheck(o.question, answerText, [], g);
      if(!LS || LS.q.k!==o.k) return;
      if(o.after) o.after();
      const v=r&&r.verdict;

function renderLangQ(ch, k, type){
  const c=LS.c, d=k.lang||{}, sp=canSpeak(c), lang=c.language.name;
  if(!(k.items||[]).length && ["lhear","lsee","lpick","ltype"].includes(type)) type = (d.sentences||[]).some(x=>tilesOf(x).length>=3) ? "lbuild" : (d.respond||[]).length ? "lrespond" : "ltrans";
  const all = order(c).flatMap(id=>c.concepts[id].items||[]);

    const it=pickItem(k), opts=shuffle([it, ...others(it,"m",all)]).map(x=>({key:x.m, html:esc(x.m)}));

    const p = `<p class="small muted">${esc(r.situation)}</p><div class="lbubble"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0">${showTR(r.line)}</div>${sp?playBtn(r.line.t):""}</div><button class="linkbtn" id="lmB" type="button" style="align-self:flex-start">What did they say?</button><div class="lm" id="lmT" hidden>${esc(r.line.m)}</div></div><div class="prompt">What do you say?</div>`;
    langChoice(ch, p, opts, right.t, {answer:`${right.t}${right.r?" ("+right.r+")":""} = ${right.m}`, why:`They said: “${r.line.m}”.`, after:()=>{ $("lmT").hidden=false; if(sp) speak(c,right.t); }});
    if(sp) setTimeout(()=>speak(c,r.line.t),350);
    const lb=$("lmB"); if(lb) lb.onclick=()=>{ $("lmT").hidden=false; lb.remove(); };
    return;
  }
  if(type==="lbuild"){

  LS.q.text = `Type: ${it.m}`;
  langTyped(ch, `<div class="prompt">How do you say “${esc(it.m)}”?</div><p class="small muted">${c.language.roman?`Type it in ${esc(c.language.roman)}. Tone marks are optional.`:"Type it."}</p>`, it, {k, placeholder: c.language.roman?`Type in ${c.language.roman}`:"Type it", question:`Say "${it.m}" in ${lang}. ${c.language.roman?c.language.roman+" without tone marks, or the native script, both count.":""}`, after:()=>{ if(sp) speak(c,it.t); }});
}

const EXAMS = [["psle","PSLE"],["sec","SEC (from 2027)"],["olevel","O-Level"],["nalevel","N(A)-Level"],["ntlevel","N(T)-Level"],["alevel","A-Level"],["other","Other exam"]];
const SG_EXAM_KEYS = new Set(["psle","sec","olevel","nalevel","ntlevel","alevel"]);
/* Ready-made official syllabuses (public/syllabi.json): checked summaries of SEAB documents, used instantly instead of a live lookup. */
let READY=null;
/* Exam style profiles (public/exam-styles.json): paper layouts, mark splits and marking conventions paraphrased from official SEAB syllabuses and specimen papers. No question text. */
let STYLES=null;
async function loadStyles(){ if(STYLES) return STYLES; try{ const r=await fetch("/exam-styles.json",{cache:"no-cache"}); STYLES = r.ok ? await r.json() : {items:{}}; }catch(e){ STYLES={items:{}}; } return STYLES; }
function styleFor(c){
  if(!STYLES || !c || !c.exam) return null; const it=STYLES.items||{};
  if(c.exam.readyId && it[c.exam.readyId]) return it[c.exam.readyId];
  const code=String((c.exam.syllabus&&c.exam.syllabus.code)||"").toUpperCase().match(/[A-Z]?\d{3,4}/); if(!code) return null;
  return Object.values(it).find(p=>String(p.code||"").toUpperCase().includes(code[0])) || null;
}
function styleText(p, forMarking){
  if(!p) return "";
  const papers=(p.papers||[]).map(x=>`${x.paper}${x.minutes?` (${x.minutes} min`:" ("}${x.marks?`, ${x.marks} marks)`:")"}: ${(x.parts||[]).map(q=>`${q.form}${q.marks?` [${q.marks}]`:""}${q.stimulus?` with ${q.stimulus}`:""}`).join("; ")}`).join("\n");
  const cw=Object.entries(p.command_words||{}).slice(0,10).map(([k,v])=>`${k}: ${v}`).join("; ");
  const m=p.marking||{}, lv=(m.levels||[]).map(l=>`${l.level} (${l.marks}): ${l.descriptor}`).join("; ");
  const out = forMarking
    ? `OFFICIAL MARKING CONVENTIONS (${p.subject} ${p.code}): ${(m.how_marks_are_earned||[]).join("; ")}${lv?`. Levels: ${lv}`:""}${m.evaluation?`. Evaluation: ${m.evaluation}`:""}${(m.common_mark_loss||[]).length?`. Marks are commonly lost for: ${m.common_mark_loss.join("; ")}`:""}.`
    : `OFFICIAL PAPER STYLE (${p.subject} ${p.code}, from SEAB documents; write NEW questions in these shapes, never copy real papers):\n${papers}${cw?`\nCommand words: ${cw}`:""}\nHow marks are earned: ${(m.how_marks_are_earned||[]).join("; ")}${lv?`\nLevels: ${lv}`:""}${(m.common_mark_loss||[]).length?`\nCommon mark loss to test for: ${m.common_mark_loss.join("; ")}`:""}${(p.practicals||[]).length?`\nPractical skills: ${p.practicals.join("; ")}`:""}${(p.style_notes||[]).length?`\nStyle: ${p.style_notes.join("; ")}`:""}`;
  return out.slice(0, forMarking?900:2400);
}
async function loadReady(){ if(READY) return READY; try{ const r=await fetch("/syllabi.json",{cache:"no-cache"}); READY = r.ok ? await r.json() : {items:[]}; }catch(e){ READY={items:[]}; } return READY; }
const normSubj = t => String(t||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
function findReady(exam, topic){ if(!READY) return null; const n=normSubj(topic); if(!n) return null;
  return READY.items.find(x=>x.exam===exam && (normSubj(x.name)===n || x.aliases.some(a=>normSubj(a)===n))) || null; }
function readyFor(exam){ return READY ? READY.items.filter(x=>x.exam===exam) : []; }
const PURPOSES = [["everyday","Everyday use"],["exam","An exam"],["understand","Understanding"]];

function daysTo(dateStr){ if(!dateStr) return null; const t=Date.parse(dateStr+"T09:00:00"); return isFinite(t) ? Math.ceil((t-Date.now())/DAY) : null; }

OFFICIAL SYLLABUS (source: ${sy.source_url}). Topics in order:
${(sy.topics||[]).map((t,i)=>`${i+1}. ${t.title}: ${(t.outcomes||[]).join("; ")}`).join("\n")}

}
function examQuestionText(c){

  return `${st?st+"\n":""}EXAM STYLE: write questions the way ${e.label} ${(sy&&sy.subject)||e.subject||c.topic} papers ask them${cw?`, using the exam's command words (${cw})`:""}${sy&&sy.assessment&&sy.assessment.length?`. Papers: ${sy.assessment.map(p=>`${p.paper}: ${p.format||""}`).join("; ")}`:""}. For every "apply" and "connect" question add "marks" matching the paper (up to 15); for "connect", "points" is the mark scheme and "marks" equals the number of points, except essay-style Discuss/Evaluate/Assess questions of 8+ marks, where "points" = 2-3 analysis points (each a full cause-and-effect chain, with a diagram where relevant) + 2 evaluation points (a criterion such as magnitude, time period, assumptions or stakeholders, ending in a justified judgement), marked by levels.

Use the syllabus's exact technical terms in answers and mark points (e.g. "water potential"), with a plain gloss in brackets; never replace the term.${/biolog|chemistr|physics|science/i.test(`${(sy&&sy.subject)||e.subject||""} ${c.topic||""}`)?` When the concept has a standard practical, one apply question tests experimental skills (variables, control, reliability, improving a method) with "skill": "practical".`:""}`;
}
function pacing(c){
  const dl = daysTo(c.exam&&c.exam.date); if(dl==null) return null;
  const remain = newCount(c), study = Math.max(1, dl-14);
  return {days:dl, remain, perDay: Math.max(1, Math.ceil(remain/study))};
}

/* mock tests */
async function startMock(){
  const c=S.cur;
  const started = order(c).filter(id=>c.concepts[id].rung>0);
  const pool = started.length>=3 ? started : order(c).slice(0,6);
  const pick = shuffle(pool).slice(0,10);
  const missing = pick.filter(id=>needsBank(c.concepts[id]));
  if(missing.length){
    if(!S.sample){ toast("Mock tests need the server connection"); return; }
    S.view="loading"; window.scrollTo(0,0); bar("");
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Setting your mock test</h3></div><p class="small muted">Writing exam-style questions. About 30 seconds.</p></div>`;
    try{ await ensureBanks(c, missing); }
    catch(e){ main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't set the mock test</strong><span>${esc(aiErr(e))}</span></div><button class="btn ghost" id="back">Back</button></div>`; $("back").onclick=()=>go("course"); return; }
  }
  const steps = pick.filter(id=>c.concepts[id].bank).map(id=>({t:"q",cid:id}));
  LS = {c, steps, i:0, touched:new Set(), count:{}, retry:{}, fresh:new Set(), snap:Object.fromEntries(pick.map(id=>[id,c.concepts[id].rung])), xp:0, right:0, total:0, pending:null, q:null,
        mock:{end:Date.now()+steps.length*90000, marks:0, total:0, missed:[], n:steps.length}};
  LS.mock.timer = setInterval(()=>{
    if(!LS||!LS.mock){ return; }
    const left = LS.mock.end-Date.now(), el=$("mockT");
    if(el) el.textContent = left>0 ? `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,"0")}` : "0:00";
    if(left<=0){ toast("Time's up"); finishLesson(); }
  }, 1000);
  L("mock_start",{course:c.title, data:{questions:steps.length, minutes:Math.round(steps.length*1.5)}});
  S.view="lesson"; renderStep();
}

function ridgeSvg(p){
  const pts=[[0,150],[70,92],[105,112],[170,50],[215,84],[265,30]], segs=[]; let tot=0;
  for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); tot+=d; }
  let want=tot*Math.max(.04,Math.min(1,p/100)), x=pts[0][0], y=pts[0][1];
  for(let i=1;i<pts.length;i++){ if(want<=segs[i-1]){ const t=want/segs[i-1]; x=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t; y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t; break; } want-=segs[i-1]; x=pts[i][0]; y=pts[i][1]; }
  return `<svg class="ridge" viewBox="0 0 390 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 150 L70 92 L105 112 L170 50 L215 84 L265 30 L330 96 L390 70 L390 150 Z" class="rf"/><path d="M0 150 L70 92 L105 112 L170 50 L215 84 L265 30" class="rt"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" class="rc"/><path d="M265 30V8" class="rp"/><path d="M265 8l14 6-14 6z" class="rflag"/></svg>`;
}

}

function fieldDepths(c){
  const mods=c.modules||[], byId=Object.fromEntries(mods.map(m=>[m.id,m])), memo={};
  const d=(m,seen)=>{ if(memo[m.id]!=null) return memo[m.id]; if(seen.has(m.id)) return 0; seen.add(m.id);
    const ns=(m.needs||[]).map(id=>byId[id]).filter(Boolean); const v=ns.length?1+Math.max(...ns.map(x=>d(x,seen))):0; seen.delete(m.id); return memo[m.id]=v; };

function pathSteps(c){
  const mods=c.modules||[]; if(!mods.length) return [];
  if(!mods.some(m=>m.needs&&m.needs.length)){ const out=[]; for(let i=0;i<mods.length;i+=2) out.push(mods.slice(i,i+2)); return out; }
  const dp=fieldDepths(c), needed=new Set(mods.flatMap(m=>m.needs||[]));

  for(let i=0;i<=max;i++){ const s=core.filter(m=>dp[m.id]===i); if(s.length) out.push(s); }

  const blockedBy = (state==="empty"||state==="ready") ? (m.needs||[]).map(id=>fieldOf(c,id)).find(f=>f && fieldInfo(c,f).state!=="done") : null;

let pathBusy=false;

${ks.map(line).join("\n")}

${txt}
>>>

/* Rewrite every concept's practice questions in the current style. Progress (levels, review dates) is kept. */
const QSTYLE = 9; // bump when the question style changes, so "Refresh questions" knows what is out of date
const staleIds = c => order(c).filter(id=>c.concepts[id] && c.concepts[id].bank && c.concepts[id].qv!==QSTYLE);
async function refreshQuestions(c, onProgress){
  const ids = staleIds(c);
  const gen = isLang(c) ? genLangBank : genBank, batches=[]; for(let i=0;i<ids.length;i+=2) batches.push(ids.slice(i,i+2));
  let done=0, failed=0, next=0;
  const worker = async()=>{ while(next<batches.length){ const b=batches[next++], before=b.map(id=>c.concepts[id].bank);
    try{ await gen(c, b); }catch(e){} b.forEach((id,i)=>{ if(c.concepts[id].bank===before[i]) failed++; else c.concepts[id].qv=QSTYLE; }); // a concept only counts once its bank was actually replaced
    done+=b.length; onProgress(done, ids.length); } };
  await Promise.all([worker(), worker()]);
  c.combos = (c.combos||[]).filter(x=>x.used); // unused combined questions are rewritten in the new style when next needed
  c.refreshed = Date.now(); saveCourse(c);
  L("questions_refreshed",{course:c.title, data:{concepts:ids.length, failed}});
  return {total:ids.length, failed};
}

      const r = await refreshQuestions(c, (d,t)=>{ const el=$("rqP"); if(el) el.textContent=`Rewriting questions… ${d}/${t}`; });

function stairSvg(c, m){
  const st=modStage(c,m), top=Math.max(4,st+1), from=Math.max(1,top-4), n=top-from+1, W=334, gap=8, bw=(W-gap*(n-1))/n;

  for(let i=0;i<n;i++){ const s=from+i, ks=modUnits(c,m).filter(u=>(u.stage||1)===s).flatMap(u=>u.concepts).map(id=>c.concepts[id]).filter(Boolean);
    const pct=ks.length?ks.reduce((t,k)=>t+Math.min(4,k.rung),0)/(ks.length*4):0, h=22+i*(64/Math.max(1,n-1)), x=i*(bw+gap), y=90-h;
    const done=ks.length&&ks.filter(k=>k.rung>=4).length/ks.length>=.8, cur=s===st&&!done, future=!ks.length;

    else if(done) bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="6" class="st-d"/><path d="M${(x+bw/2-8).toFixed(1)} ${(y+h/2).toFixed(1)}l5 5 9-10" class="st-ck"/>`;
    else { bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="6" class="st-b"/><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(6,bw*pct).toFixed(1)}" height="${h.toFixed(1)}" rx="6" class="st-p"/>${cur?`<text x="${(x+bw/2).toFixed(1)}" y="${(y+h/2+5).toFixed(1)}" text-anchor="middle" class="st-t${pct<.5?" dk":""}">${Math.round(pct*100)}%</text><circle cx="${(x+bw/2).toFixed(1)}" cy="${(y-12).toFixed(1)}" r="7" class="st-me"/>`:""}`; }
    labels.push(`<span class="${done?"d":cur?"c":""}">${esc(stageName(s))}</span>`); }

}

function radarSvg(sk){

  const val=k=>{ const s=sk[k]; return s&&s.n ? s.ok/s.n : 0; };
  const pts=keys.map((k,i)=>pt(i, R*Math.max(.04,val(k))));
  const lab=keys.map((k,i)=>{ const [x,y]=pt(i,R+14), s=sk[k], a=Math.abs(x-cx)<6?"middle":x>cx?"start":"end"; return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${a}" class="rl">${esc(SKILLS[k])}<tspan class="rv"> ${s&&s.n?Math.round(val(k)*100)+"%":"–"}</tspan></text>`; }).join("");

$("homeBtn").onclick = ()=>{ if(LS) quitLesson(true); else go("home"); };

function renderHome(){
  const d=S.draft;
  const list = Object.values(S.courses).sort((a,b)=>(b.updated||0)-(a.updated||0));
  if(!list.some(c=>c.id==="example-memory")) list.push(makeExample());
  const sugg = shuffle(SUGGEST).slice(0,6);
  main.innerHTML = `
  <div class="card">
    <h1>What do you want to learn?</h1>
    <p class="muted">Type anything. Climb maps it into short lessons that start easy and get harder as you improve.</p>
    <input type="text" class="big" id="fTopic" placeholder="e.g. How interest rates work" value="${esc(d.topic)}">
    <div class="seg" role="group" aria-label="Your level">${LEVELS.map(([k,n])=>`<button type="button" data-l="${k}" class="${d.level===k?"on":""}">${n}</button>`).join("")}</div>
    <span class="label">What's this for?</span>
    <div class="seg" id="purposeSeg" role="group" aria-label="What's this for">${PURPOSES.map(([k2,n])=>`<button type="button" data-p="${k2}" class="${d.purpose===k2?"on":""}">${n}</button>`).join("")}</div>
    <div class="exambox" id="examBox"${d.purpose==="exam"?"":" hidden"}>
      <div class="chips" id="examChips">${EXAMS.map(([k2,n])=>`<button type="button" class="chip${d.exam===k2?" on":""}" data-e="${k2}">${n}</button>`).join("")}</div>
      <input type="text" id="fExamName" placeholder="Which exam? e.g. IELTS, HSK 3"${d.exam==="other"?"":" hidden"} value="${esc(d.examName)}">
      <label class="small muted" for="fExamDate">Exam date (optional, for pacing)</label>
      <input type="date" id="fExamDate" value="${esc(d.examDate)}">
      <div id="readyBox"></div>
      <p class="tiny muted" id="examHint"></p>
    </div>
    <details id="more"${d.notes||d.goal||d.images.length?" open":""}><summary>+ Add a goal, notes or photos</summary><div class="dbody">
      <input type="text" id="fGoal" placeholder="Goal (optional), e.g. Pass my A-level econs paper" value="${esc(d.goal)}">
      <textarea id="fNotes" placeholder="Paste notes, an article or a syllabus (optional)">${esc(d.notes)}</textarea>
      <div class="row"><label class="btn soft sm" for="fFile">Upload .txt or .md</label><input type="file" id="fFile" accept=".txt,.md,.csv,text/plain,text/markdown" hidden>
      ${S.imagesOk?`<label class="btn soft sm" for="fImgs">Add photos of notes</label><input type="file" id="fImgs" accept="image/*" multiple hidden>`:""}</div>
      <div class="thumbs" id="thumbs"></div></div></details>
    <button class="btn block" id="build"${S.sample?"":" disabled"}>Build my course</button>
    <div class="row" style="justify-content:space-between"><span class="small muted">Written by</span><button class="chip" id="modelBtn" type="button">${esc(curModel().n)} ▾</button></div>
    ${S.sample?"":`<p class="small muted">Building courses needs Claude access, which isn't available in this view. You can still try the example course.</p>`}
    <p class="tiny muted">Climb anonymously records what you do and what it generates, to improve its lessons.</p>
    <div class="chips sugg">${sugg.map(s=>`<button class="chip" type="button">${esc(s)}</button>`).join("")}</div>
  </div>
  <span class="label">Your courses</span>
  <div style="display:flex;flex-direction:column;gap:10px">${list.map(c=>{ const due=dueCount(c), nw=newCount(c), p=progress(c);
    return `<button class="course" data-id="${esc(c.id)}"><div style="min-width:0"><h3>${esc(c.title)}${c.example?'<span class="tag">Example</span>':""}</h3><p class="small muted">${order(c).length} concepts · ${due?`<span class="due">${due} to review</span>`:nw?`${nw} new to learn`:"All caught up"}</p></div>${ring(p,52)}</button>`; }).join("")}</div>`;
  const sync=()=>{ d.topic=$("fTopic").value; d.goal=$("fGoal").value; d.notes=$("fNotes").value; };
  ["fTopic","fGoal","fNotes"].forEach(id=>$(id).oninput=sync);
  main.querySelectorAll(".seg button[data-l]").forEach(b=>b.onclick=()=>{ d.level=b.dataset.l; main.querySelectorAll(".seg button[data-l]").forEach(x=>x.classList.toggle("on",x===b)); });
  main.querySelectorAll("#purposeSeg button").forEach(b=>b.onclick=()=>{ d.purpose=b.dataset.p; main.querySelectorAll("#purposeSeg button").forEach(x=>x.classList.toggle("on",x===b)); $("examBox").hidden = d.purpose!=="exam"; });
  main.querySelectorAll("#examChips .chip").forEach(b=>b.onclick=()=>{ d.exam=b.dataset.e; main.querySelectorAll("#examChips .chip").forEach(x=>x.classList.toggle("on",x===b)); $("fExamName").hidden = d.exam!=="other"; drawReady(); });
  $("fExamName").oninput=()=>{ d.examName=$("fExamName").value; }; $("fExamDate").oninput=()=>{ d.examDate=$("fExamDate").value; };
  main.querySelectorAll(".chips.sugg .chip").forEach(b=>b.onclick=()=>{ $("fTopic").value=b.textContent; sync(); $("fTopic").focus(); });
  const drawReady=()=>{ const box=$("readyBox"), hint=$("examHint"); if(!box) return;
    const items=readyFor(d.exam);
    box.innerHTML = items.length ? `<span class="label">Official syllabus ready · tap a subject</span><div class="chips" id="readyChips">${items.map(x=>`<button type="button" class="chip${normSubj(d.topic)===normSubj(x.name)?" on":""}" data-r="${esc(x.id)}">${esc(x.name)}</button>`).join("")}</div>` : "";
    box.querySelectorAll("#readyChips .chip").forEach(b=>b.onclick=()=>{ const x=READY.items.find(i=>i.id===b.dataset.r); $("fTopic").value=x.name; sync(); box.querySelectorAll(".chip").forEach(y=>y.classList.toggle("on",y===b)); });
    hint.textContent = d.exam==="olevel"||d.exam==="nalevel"||d.exam==="ntlevel" ? "From 2027, O-Levels and N-Levels are replaced by the SEC exam. Sitting your exam in 2027 or later? Choose SEC."
      : d.exam==="other" ? "Climb will follow this exam's usual content and question style."
      : items.length ? "Another subject? Type it above and Climb will look up the official SEAB syllabus (up to a minute the first time)."

  loadReady().then(drawReady);
  $("fFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $("fNotes").value=($("fNotes").value?$("fNotes").value+"\n\n":"")+String(r.result).slice(0,60000); if(!$("fTopic").value) $("fTopic").value=f.name.replace(/\.[^.]+$/,""); sync(); }; r.readAsText(f); e.target.value=""; };

function thumbs(){ const t=$("thumbs"); if(!t) return; t.innerHTML=""; S.draft.images.forEach((f,i)=>{ const img=document.createElement("img"); img.src=URL.createObjectURL(f); img.alt="Photo "+(i+1)+", tap to remove"; img.onclick=()=>{ S.draft.images.splice(i,1); thumbs(); }; t.appendChild(img); }); }

async function onBuild(){
  const d=S.draft; d.topic=String(d.topic||"").trim(); d.goal=String(d.goal||"").trim(); d.notes=String(d.notes||"").trim(); d.uni=String(d.uni||"").trim();
  if(!d.topic && !d.notes && !d.images.length){ toast("Type a topic first"); startNew(); return; }
  if(d.purpose==="uni" && d.uni && !d.goal) d.goal="University prep: "+d.uni;
  S.view="building"; window.scrollTo(0,0);
  let focus="", scoped=false, kind=null, syllabus=null;
  const examMode = d.purpose==="exam";
  if(examMode){ d.examName=String(d.examName||"").trim(); }
  if(examMode && SG_EXAM_KEYS.has(d.exam) && d.topic){ await loadReady(); const rd=findReady(d.exam, d.topic);
    if(rd){ syllabus=rd.syllabus; d.readyId=rd.id; L("syllabus_found",{data:{exam:d.exam, subject:d.topic, code:syllabus.code, year:syllabus.year, ready:true, source:syllabus.source_url, topics:(syllabus.topics||[]).length}}); } }
  if(!syllabus && examMode && SG_EXAM_KEYS.has(d.exam) && d.topic && window.climbSyllabus){
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Finding the official syllabus</h3></div><p class="small muted">Searching SEAB for the ${esc(examLabel(d.exam))} ${esc(d.topic)} syllabus and reading it. This can take up to a minute the first time; after that it's instant.</p></div>`;
    try{
      const r = await window.climbSyllabus(d.exam, d.topic, d.examDate ? d.examDate.slice(0,4) : String(new Date().getFullYear()));
      syllabus = r.syllabus;
      L("syllabus_found",{data:{exam:d.exam, subject:d.topic, code:syllabus.code, year:syllabus.year, cached:!!r.cached, source:syllabus.source_url, topics:(syllabus.topics||[]).length}});
    }catch(e){ L("syllabus_failed",{data:{exam:d.exam, subject:d.topic, error:String(e&&e.message)}}); }
  }
  let module=null; { const all=`${d.topic} ${d.goal} ${d.uni}`, uniKey=/\bNUS\b|National University of Singapore/i.test(all)?"nus":/\bNTU\b|Nanyang Tech/i.test(all)?"ntu":null, mc=all.match(/\b([A-Za-z]{2,4})\s?(\d{4}[A-Za-z]{0,2})\b/);
    if(!examMode && uniKey && mc && window.climbModule){
      main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Reading ${esc(uniKey.toUpperCase())} ${esc((mc[1]+mc[2]).toUpperCase())}</h3></div><p class="small muted">Getting the official module description${uniKey==="ntu"?" and course outline":""} so your course follows it.</p></div>`;
      try{ module=(await window.climbModule(uniKey, mc[1]+mc[2], d.topic)).module; L("module_found",{data:{uni:uniKey, code:module.code, title:module.title, source:module.source_url}}); }
      catch(e){ L("module_failed",{data:{uni:uniKey, code:mc[1]+mc[2], error:String(e&&e.message)}}); } } }
  if(d.topic && !d.notes && !d.images.length){
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Looking at ${esc(d.topic)}</h3></div><p class="small muted">Working out what kind of subject this is${examMode?"":" and whether it needs narrowing down"}…</p></div>`;
    try{
      const sc = await scopeTopic(d);
      if(sc && KINDS.includes(sc.kind)) kind = sc.kind;
      if(!examMode && sc && sc.broad && Array.isArray(sc.options) && sc.options.length){
        const pick = await chooseFocus(d, sc);
        if(pick===null){ go("home"); return; }
        focus=pick; scoped=true; L("focus_chosen",{data:{topic:d.topic, choice:pick||"broad overview", options:(sc.options||[]).map(o=>o.title)}});
      }
    }catch(e){}
  }
  const steps=(a,b,extra)=>{ main.innerHTML=`<div class="card"><span class="label">Building your course</span><h2>${esc(d.topic||"Your notes")}</h2>${focus?`<p class="small muted">Focus: ${esc(focus)}</p>`:""}${syllabus?`<p class="small muted">Using the official SEAB syllabus ${esc(syllabus.code||"")}${syllabus.year?" ("+esc(syllabus.year)+")":""}${syllabus.checked?" · checked":""}.</p>`:examMode&&SG_EXAM_KEYS.has(d.exam)?`<p class="small muted">Couldn't find the official syllabus, so building from what Claude knows about this exam.</p>`:""}${kind?`<p class="small muted">${esc((PLANS[kind]||PLANS.general).label)} lesson plan</p>`:""}
    <ul class="steps"><li>${a?'<span class="done"></span>':'<div class="spinner"></div>'}<span>Mapping the topic into concepts</span></li><li>${b?'<span class="done"></span>':a?'<div class="spinner"></div>':'<span class="dot"></span>'}<span>Writing your first lesson</span></li></ul>
    ${extra||'<p class="small muted">This takes about 20 to 40 seconds.</p>'}</div>`; };
  steps(false,false);
  try{
    const c = await buildCourse({topic:d.topic, level:d.level, goal:d.goal, notes:d.notes, images:d.images, focus, scoped, kind, purpose:d.purpose, uni:d.purpose==="uni"?d.uni:(module?module.uni:""), module,
      exam: examMode ? {key:d.exam, readyId:d.readyId||null, label:examLabel(d.exam), subject:(syllabus&&syllabus.subject)||d.topic, name:d.examName, date:d.examDate, syllabus} : null});
    if(focus) c.focus_text=focus;
    L("course_built",{course:c.title, data:{topic:d.topic, level:d.level, goal:d.goal, focus, kind:c.kind, purpose:c.purpose, exam:c.exam?{key:c.exam.key, date:c.exam.date, code:c.exam.syllabus&&c.exam.syllabus.code}:null, language:c.language||null, hasNotes:!!d.notes, photos:d.images.length, writer:c.writer, units:c.units.map(u=>({title:u.title, concepts:u.concepts.map(id=>c.concepts[id].name)}))}});
    steps(true,false, `<div style="display:flex;flex-direction:column;gap:10px"><h3>${esc(c.title)}</h3>${c.units.map((u,i)=>`<div><span class="label">Unit ${i+1}</span><p class="small"><b>${esc(u.title)}</b>: <span class="muted">${u.concepts.map(id=>esc(c.concepts[id].name)).join(" · ")}</span></p></div>`).join("")}</div>`);
    saveCourse(c);
    const first=buildLesson(c);
    await Promise.all([ensureBanks(c, first.all).catch(()=>{}), ensureTeach(c, first.fresh).catch(()=>{}), planMap(c).catch(e=>L("map_failed",{course:c.title, data:{error:String(e&&e.message)}}))]);
    S.draft={topic:"",level:d.level,goal:"",notes:"",images:[],purpose:d.purpose,exam:d.exam,examName:"",examDate:""};
    S.cur=c; S.mapMode="map"; S.selField=null; go("map"); prefetch(c);
  }catch(e){
    main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't build the course</strong>${(L("course_build_failed",{data:{topic:d.topic, level:d.level}}),"")}<span>${esc(aiErr(e))}</span></div><button class="btn block" id="back">Back</button></div>`;
    $("back").onclick=()=>go("home");
  }
}

function stopHtml(k){
  const now=Date.now();
  const cls = k.rung>=5 ? "mastered" : k.rung>0 && k.due<=now ? "due started" : k.rung>0||k.seen>0 ? "started" : "";
  const st = k.rung>=5 ? "Mastered" : k.rung>0 && k.due<=now ? "Due for review" : k.rung>0 ? `Level ${k.rung} · ${LVN[k.rung]}` : k.seen>0 ? "Met it, keep going" : "Not started";
  return `<button class="stop ${cls}" data-id="${esc(k.id)}"><span class="node"></span><span style="min-width:0"><b>${esc(k.name)}</b><span class="st">${st}</span></span>${pips(k.rung)}</button>`;
}
function unitLabel(c,u,n){
  if(u.parent){ const p=c.concepts[u.parent]; return `Branch · deeper into ${esc(p?p.name:"a concept")}`; }
  if(u.angle) return `Branch · ${esc(u.angle)}`;
  return `Unit ${n}`;
}
function renderCourse(){ S.view="map"; renderPath(); }
function renderCourseBody(){
  const c=S.cur; if(!c){ go("home"); return; }
  const p=progress(c), plan=buildLesson(c), nf=plan.fresh.length, nr=plan.extra?0:plan.reviews;
  const sub = plan.extra ? "Extra practice on your weakest concepts" : [nr?`${nr} to review`:"", nf?`${nf} new concept${nf>1?"s":""}`:""].filter(Boolean).join(" · ");
  const fu = c.focus && c.units.find(u=>u.id===c.focus && u.concepts.some(id=>c.concepts[id]&&c.concepts[id].rung===0));
  const angles = (c.angles&&c.angles.length ? c.angles : DEFAULT_ANGLES).slice(0,6);
  let n=0;
  main.innerHTML = `
  <div class="row"><button class="btn ghost sm" id="back">← Courses</button></div>
  <div class="card">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start">
      <div style="min-width:0;display:flex;flex-direction:column;gap:4px"><span class="label">${c.example?"Example course":"Course"}</span><h1 style="font-size:26px">${esc(c.title)}</h1><p class="small muted">${esc(c.goal||"")}</p>${c.writer?`<p class="tiny muted">Written by ${esc(c.writer)}</p>`:""}</div>${ring(p,64)}</div>
    <button class="btn block" id="go">Start lesson</button>
    <p class="small muted" style="text-align:center">${fu?`Next up: <b>${esc(fu.title)}</b> · `:""}${sub} · about 4 minutes</p>
    ${!newCount(c)&&!c.example?`<p class="small" style="text-align:center">You've met every concept so far. ${hasMap(c)?"Expand a field below to keep climbing.":"Grow the course below to keep climbing."}</p>`:""}
  </div>
  ${c.uni&&!isExam(c)?`<div class="card"><span class="label">University prep</span><h2>${esc(c.uni)}</h2><p class="small muted">Questions follow first-year module style: precise terms, calculations with working, and discuss/evaluate answers marked against a mark scheme.</p>${c.module?`<p class="tiny muted">Built from the official ${esc(c.module.uni)} ${esc(c.module.code)} ${esc(c.module.title)} module information${c.module.year?" ("+esc(c.module.year)+")":""}. <a href="${esc(c.module.source_url)}" target="_blank" rel="noopener">Open it</a></p>`:""}<button class="btn soft block" id="mockBtn">Take a uni-style test · 10 questions</button></div>`:""}
  ${isExam(c)?(()=>{ const e=c.exam, sy=e.syllabus, pc=pacing(c);
    return `<div class="card"><span class="label">Exam</span><h2>${esc(e.label)} ${esc(sy&&sy.subject||e.subject)}</h2>
      ${sy?`<p class="small">Built from the official SEAB syllabus${sy.code?" "+esc(sy.code):""}${sy.year?" ("+esc(sy.year)+")":""}${sy.checked?" · checked "+esc(sy.checked):""}. <a href="${esc(sy.source_url)}" target="_blank" rel="noopener">Open the syllabus</a></p>${sy.assessment&&sy.assessment.length?`<p class="small muted">${sy.assessment.map(p=>esc(`${p.paper}${p.duration?" · "+p.duration:""}${p.marks?" · "+p.marks+" marks":""}`)).join("<br>")}</p>`:""}`:`<p class="small muted">No official syllabus was found, so this course follows the usual content of this exam. Add your syllabus or notes when building for a closer match.</p>`}
      ${pc?(pc.days>0?`<p class="small"><b>${pc.days} days to go.</b> ${pc.remain} concepts left, so lessons now introduce about ${pc.perDay} a day, leaving two weeks for revision.</p>`:`<p class="small">Exam date has passed.</p>`):""}
      <button class="btn soft block" id="mockBtn">Take a practice test · up to 10 questions</button></div>`; })():""}
  ${hasMap(c) ? mapHtml(c) : `<div class="card">
    ${(()=>{ const pl=planOf(c); return `<span class="plan">${esc(pl.label)} lesson plan</span><p class="small muted">${esc(pl.desc)}</p>`; })()}
    <div class="row" style="justify-content:space-between"><h2>Your route</h2>${pips(5)}</div>
    <p class="small muted">Each concept climbs five levels: recognise, cue, recall, apply, then explain. Tap a concept to see its notes or go deeper.</p>
    ${c.units.map(u=>{ const br=!!(u.parent||u.angle); const lab=br?unitLabel(c,u):unitLabel(c,u,++n);
      return `<div class="unit${br?" branch":""}"><span class="label">${lab}</span><h3>${esc(u.title)}</h3>${u.concepts.filter(id=>c.concepts[id]).map(id=>stopHtml(c.concepts[id])).join("")}</div>`; }).join("")}
  </div>
  ${c.example?"":`<div class="card" id="mapCard"><h2>Grow this into a full course</h2>
    <p class="small muted">Map out the whole subject as fields you can keep expanding, wider and deeper, for as long as you like. Your progress stays.</p>
    <button class="btn block" id="mapBtn"${S.sample?"":" disabled"}>Map out the full subject</button></div>`}
  <div class="card" id="branchCard">
    <h2>Branch out</h2>
    <p class="small muted">Explore another side of this topic. A new branch jumps to the front of your next lesson.</p>
    <div class="chips">${angles.map((a,i)=>`<button class="chip" data-i="${i}">${esc(a)}</button>`).join("")}</div>
    <form class="row" id="angleForm" autocomplete="off"><input type="text" id="angleIn" placeholder="Or your own, e.g. the maths behind it" style="flex:1 1 200px"><button class="btn sm" type="submit">Build branch</button></form>
    <button class="btn soft block" id="nextUnit">Continue the main route</button>
    ${S.sample?"":`<p class="small muted">Branching needs Claude access in this view.</p>`}
  </div>`}
  ${c.example?"":`<div class="row"><button class="btn ghost sm" id="del" style="color:var(--bad)">Delete course</button></div><div id="confirm"></div>`}`;
  $("back").onclick=()=>go("home");
  $("go").onclick=()=>startLesson();
  const mb=$("mockBtn"); if(mb) mb.onclick=()=>startMock();
  main.querySelectorAll(".stop").forEach(b=>b.onclick=()=>sheet(c, c.concepts[b.dataset.id]));

  const card=$("branchCard");
  if(card){
  if(!S.sample) card.querySelectorAll("button,input").forEach(x=>x.disabled=true);
  const run = async (o, label)=>{
    card.querySelectorAll("button,input").forEach(x=>x.disabled=true);
    card.insertAdjacentHTML("beforeend", `<div class="fb info"><div class="row"><div class="spinner"></div><span>${esc(label)}</span></div></div>`);
    try{ await addBranch(c, o); toast(o.angle?"Branch added. Your next lesson starts it.":"New unit added"); }catch(e){ toast(aiErr(e)); }
    renderCourse(); prefetch(c);
  };
  card.querySelectorAll(".chip").forEach(b=>b.onclick=()=>run({angle:angles[+b.dataset.i]}, `Building a branch on ${angles[+b.dataset.i]}…`));
  $("angleForm").onsubmit=e=>{ e.preventDefault(); const v=$("angleIn").value.trim(); if(!v){ $("angleIn").focus(); return; } run({angle:v}, `Building a branch on ${v}…`); };

async function startLesson(opts){
  opts = opts && opts.only ? opts : {};
  bar(""); main.classList.remove("lesson");
  const c=S.cur, plan=buildLesson(c, opts.only);
  if(!opts.only && plan.steps.length && comboReady(c) && freshCombos(c).length){ const x=freshCombos(c)[0]; plan.steps.push({t:"combo", combo:x.id, cid:x.uses[0]}); }
  if(!plan.steps.length){ toast("Nothing to practise yet"); return; }
  const missing = S.sample ? plan.all.filter(id=>needsBank(c.concepts[id])) : plan.all.filter(id=>!c.concepts[id].bank);
  const teachNeed = S.sample && !isLang(c) ? plan.fresh.filter(id=>needsTeach(c.concepts[id])) : [];
  if(missing.length || teachNeed.length){
    if(!S.sample){ toast("Lessons need Claude access in this view"); return; }
    S.view="loading"; window.scrollTo(0,0);
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Preparing your lesson</h3></div><p class="small muted">Writing ${teachNeed.length?"mini-lessons, diagrams and ":""}questions. About 20 to 40 seconds.</p></div>`;
    try{ await Promise.all([ensureBanks(c, missing), ensureTeach(c, teachNeed).catch(()=>{})]); }
    catch(e){ main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't prepare the lesson</strong>${(L("lesson_prep_failed",{course:c.title}),"")}<span>${esc(aiErr(e))}</span></div><div class="row"><button class="btn" id="retry">Try again</button><button class="btn ghost" id="back">Back</button></div></div>`; $("retry").onclick=()=>startLesson(opts); $("back").onclick=()=>go("course"); return; }
  }
  if(c.example) saveCourse(c);
  LS = {c, steps:plan.steps, i:0, touched:new Set(), count:{}, retry:{}, fresh:new Set(plan.fresh), snap:Object.fromEntries(plan.all.map(id=>[id,c.concepts[id].rung])), xp:0, right:0, total:0, pending:null, q:null};
  L("lesson_start",{course:c.title, data:{field:opts.field||null, combo:plan.steps.some(x=>x.t==="combo"), steps:plan.steps.length, newConcepts:plan.fresh.map(id=>c.concepts[id].name), reviews:plan.reviews, extra:plan.extra, accuracy:accuracy(c)}});
  S.view="lesson"; renderStep(); prefetch(c);
}

    ${out==="wrong"&&hookOf(k)?`<div class="hook"><span class="label">Memory hook</span><span>${gloss(hookOf(k))}</span></div>`:""}
    <div class="vlinks"><button class="linkbtn" id="flag" type="button">Flag this question</button>${out!=="right"&&k.teach&&k.teach.visual&&!["label","order","sort"].includes(q.type)?`<button class="linkbtn" id="pic" type="button">Show me the picture</button>`:""}${S.sample?`<button class="linkbtn" id="simpler" type="button">Explain simpler</button><button class="linkbtn" id="deeper" type="button">Explain in more depth</button>`:""}${o.canGuess?`<button class="linkbtn" id="guess" type="button">I guessed</button>`:""}${out==="wrong"&&o.guess?`<button class="linkbtn" id="mine" type="button">I was right</button>`:""}</div>
    ${(S.profile.tipTerms||0)<4?`<p class="tiny muted">Tip: tap an underlined word, or press and hold any word, to see what it means.</p>`:""}
    <div id="deepOut"></div></div>`;
  S.profile.tipTerms=(S.profile.tipTerms||0)+1;
  { const vd=$("verdict"); if(vd){ const fit=()=>{ document.documentElement.style.setProperty("--sheet-h", vd.offsetHeight+"px"); vd.classList.toggle("scrolls", vd.scrollHeight>vd.clientHeight+4 && vd.scrollTop+vd.clientHeight<vd.scrollHeight-8); }; requestAnimationFrame(()=>{ fit(); const prev=$("fb")&&$("fb").previousElementSibling; if(prev){ const over=prev.getBoundingClientRect().bottom - vd.getBoundingClientRect().top + 12; if(over>0) window.scrollBy({top:over, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); } }); vd.addEventListener("scroll", fit, {passive:true}); } } // keep what the learner answered visible above the sheet
  const last = LS.i+1>=LS.steps.length && out!=="wrong" && !(LS.fresh.has(k.id)&&(LS.count[k.id]||0)<1);
  bar(`<button class="btn block" id="next">${last?"Finish lesson":"Continue"}</button>`);
  $("next").onclick=nextStep;
  if(isLang(LS.c)) main.querySelectorAll(".card .lbig,.card .lt,.vans span:last-child").forEach(el=>{ if(!el.closest("button") && !el.querySelector("button")) el.innerHTML=langTap(LS.c, el.textContent); });
  try{ $("verdict").scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){}
  const g=$("guess"); if(g) g.onclick=()=>regrade("lucky","It'll come back sooner so you can lock it in.");
  const m=$("mine"); if(m) m.onclick=()=>regrade("right","Counted as correct.");
  const fl=$("flag"); if(fl) fl.onclick=()=>{ fl.outerHTML=`<span class="chips" id="flagChips">${["Confusing","Missing background","Answer is wrong","Too easy","Too hard","Uses words I don't know"].map(r=>`<button class="chip" type="button">${r}</button>`).join("")}</span>`; $("flagChips").querySelectorAll(".chip").forEach(c2=>c2.onclick=()=>{ L("flag",{course:LS&&LS.c.title, concept:k.name, data:{reason:c2.textContent, type:q.type, level:q.eff, question:q.text, answer:o.answer||null, outcome:out}}); $("flagChips").outerHTML='<span class="small muted">Thanks, noted. This helps improve the lessons.</span>'; }); };
  const pic=$("pic"); if(pic) pic.onclick=()=>{ L("help",{course:LS&&LS.c.title, concept:k.name, data:{kind:"picture", question:q.text}}); pic.remove(); const box=$("deepOut"); box.className="deep"; box.innerHTML=visualHtml(k.teach.visual,{hint:"Tap each part to review it."}); wireVisual(box, k.teach.visual); };
  const smp=$("simpler"); if(smp) smp.onclick=()=>{ L("help",{course:LS&&LS.c.title, concept:k.name, data:{kind:"simpler", question:q.text}}); smp.remove(); const box=$("deepOut"); box.className="deep"; box.innerHTML=`<span class="label">Simpler</span><div class="read" style="font-size:16px"></div>`; streamInto(box.lastElementChild, simplerPrompt(LS&&LS.c, k, q.text)); };
  const dp=$("deeper"); if(dp) dp.onclick=async()=>{ L("help",{course:LS&&LS.c.title, concept:k.name, data:{kind:"deeper", question:q.text}});
    dp.remove(); const box=$("deepOut"); box.className="deep";
    box.innerHTML=`<span class="label">Going deeper</span><div class="read" id="deepTxt" style="font-size:16px">Thinking…</div>`;
    const t=$("deepTxt");
    try{ await S.sample(`A learner studying "${LS?LS.c.title:""}" just answered a question about "${k.name}".
QUESTION: ${q.text}
${o.answer?"CORRECT ANSWER: "+o.answer:""}
CONCEPT: ${k.summary}
${LS&&isLang(LS.c)?"Explain the usage, grammar or pronunciation point behind this in under 130 words, with 2 more example sentences (with romanisation if the language uses it) and their English meaning.":"Explain this more deeply in under 130 words of plain language: why it's true, how it works underneath, and one non-obvious detail or real-world case that goes beyond the basics."} Define any technical term in a few plain words the first time you use it. No headings, no preamble.`, {modelTier:"default", onText:({text})=>{ t.textContent=text; }}); t.innerHTML=gloss(t.textContent); }
    catch(e){ t.textContent=aiErr(e); }
  };
}
function regrade(out, msg){
  L("regrade",{course:LS&&LS.c.title, concept:LS&&LS.q.k.name, data:{to:out, question:LS&&LS.q.text}});
  const q=LS.q; q.undo();
  if(LS.pending.out==="right") LS.right--; LS.xp-=q.xp;
  q.undo = grade(LS.c, q.k, Math.min(q.eff, q.L||q.eff), out);
  if(out==="right") LS.right++;
  q.xp = xpFor(out,q.eff); LS.xp+=q.xp; LS.pending.out=out;
  const v=$("verdict"), vh=verdictHead(out,{},q);
  v.className="verdict "+vh.kind; $("vh").innerHTML=vh.html + `<p class="small">${esc(msg)}</p>`;
  ["guess","mine"].forEach(id=>{ const x=$(id); if(x) x.remove(); });
}
function nextStep(){
  const p=LS.pending; LS.pending=null;
  if(p && !LS.mock){
    const k=LS.c.concepts[p.cid]; LS.count[p.cid]=(LS.count[p.cid]||0)+1;
    const at=Math.min(LS.steps.length, LS.i+3);
    const later=LS.steps.some((s,j)=>j>LS.i&&s.cid===p.cid&&s.t==="q");
    if((p.out==="wrong"||p.out==="lucky") && (LS.retry[p.cid]||0)<2 && !later){ LS.retry[p.cid]=(LS.retry[p.cid]||0)+1; LS.steps.splice(at,0,{t:"q",cid:p.cid}); }
    else if((p.out==="right"||p.out==="helped") && LS.fresh.has(p.cid) && LS.count[p.cid]<2 && k.rung<5 && !later){ LS.steps.splice(at,0,{t:"q",cid:p.cid}); }
  }
  LS.i++; saveCourse(LS.c); renderStep();
}
function finishLesson(){
  if(!LS) return;
  bar(""); main.classList.remove("lesson");
  const mock = LS.mock; if(mock && mock.timer) clearInterval(mock.timer);
  if(mock){ // unanswered and skipped questions count as zero, so running out of time never raises the score
    const left = LS.steps.length - (mock.done||0);
    LS.steps.slice(LS.steps.length-Math.max(0,left)).forEach(st=>{ const cx = st.t==="combo" ? (LS.c.combos||[]).find(x=>x.id===st.combo) : null; mock.total += cx ? (cx.marks||3) : 1; const kk=LS.c.concepts[st.cid]; if(kk) mock.missed.push(kk.name); });
    mock.marks = Math.round(mock.marks*2)/2; }
  if(mock) L("mock_done",{course:LS.c.title, data:{marks:mock.marks, total:mock.total, answered:LS.total, of:LS.steps.length, missed:mock.missed}});
  const c=LS.c; c.lessons=(c.lessons||0)+1;
  L("lesson_done",{course:c.title, data:{right:LS.right, total:LS.total, xp:LS.xp, levels:Object.entries(LS.snap).map(([id,r])=>({concept:c.concepts[id]&&c.concepts[id].name, from:r, to:c.concepts[id]&&c.concepts[id].rung}))}});
  const bonus=15; addXp(LS.xp+bonus); saveCourse(c);
  const climbed = Object.entries(LS.snap).map(([id,r])=>({k:c.concepts[id], from:r})).filter(x=>x.k&&x.k.rung>x.from);
  const pct = LS.total ? Math.round(LS.right/LS.total*100) : 0;
  const now=Date.now(), nextDue=order(c).map(id=>c.concepts[id]).filter(k=>k.rung>0&&k.due>now).map(k=>k.due).sort((a,b)=>a-b)[0];
  const nw=newCount(c), a=accuracy(c);
  const pace = a==null || mock ? "" : a>=.9 ? "You're finding this easy, so the next lesson brings more new concepts and harder questions." : a<.7 ? "This is a tough patch, so the next lesson slows down: fewer new concepts, more practice." : "Good pace. You're in the sweet spot where learning sticks best.";
  const xp=LS.xp+bonus, s=S.profile.streak;
  LS=null; S.view="done"; window.scrollTo(0,0);
  const mpct = mock && mock.total ? Math.round(mock.marks/mock.total*100) : 0, mockN = mock ? (mock.n||0) : 0;
  const reviewHtml = mock && mock.review && mock.review.length ? `<details class="mreview"><summary><b>Review answers</b></summary>${mock.review.map((r,i)=>`<div class="mrow"><span class="small"><b>${i+1}.</b> ${esc(r.q)}</span><span class="tiny muted">${r.got}/${r.of} mark${r.of>1?"s":""}</span>${r.got<r.of&&(r.better||r.ans)?`<span class="small"><span class="muted">${r.better?"A strong answer":"Answer"}:</span> ${gloss(r.better||r.ans)}</span>`:""}</div>`).join("")}</details>` : "";
  main.innerHTML = `<div class="card pop"><span class="label">${mock?(mock.combined?"Combined test complete":"Practice test complete"):"Lesson complete"}</span><h1>${mock?`${mock.marks}/${mock.total} marks`:pct>=85?"Strong climb":pct>=60?"Solid progress":"Good effort"}</h1>
    ${mock?`<p class="small">Answered ${mock.done||0} of ${mockN}. ${mpct}% of marks. ${mock.missed.length?`Worth revising: ${esc([...new Set(mock.missed)].join(", "))}. These come back sooner in your lessons.`:"Nothing dropped. Keep your lessons going to stay sharp."}</p>`:""}
    <div class="stats"><div><b>${mock?mpct:pct}%</b><span>${mock?"of marks":"correct"}</span></div><div><b>+${xp}</b><span>XP</span></div><div><b>${s}</b><span>day streak</span></div></div>
    ${pace?`<p class="small">${pace}</p>`:""}${reviewHtml}
    <span class="label">Levelled up</span>
    ${climbed.length?`<div class="climbed">${climbed.map(x=>`<div><span style="min-width:0"><b>${esc(x.k.name)}</b><br><span class="small muted">Level ${x.from} → ${x.k.rung} · ${LVN[x.k.rung]}</span></span>${pips(x.k.rung)}</div>`).join("")}</div>`:`<p class="small muted">No level-ups this time. Missed concepts come back sooner, which is exactly how they stick.</p>`}
    <p class="small muted">${nw?`${nw} new concept${nw>1?"s":""} waiting. `:""}${nextDue?`Next review due ${ago(nextDue-now)}.`:""}</p>
    <div class="row"><button class="btn" id="again" style="flex:1">Next lesson</button><button class="btn ghost" id="toCourse" style="flex:1">Your path</button></div></div>`;
  $("again").onclick=()=>startLesson(); $("toCourse").onclick=()=>go("course");
}

/* ---------- boot ---------- */
async function boot(){
  loadStyles();
  const p=lsGet("climb_profile"); if(p) S.profile={...S.profile,...p};
  const local=lsGet("climb_courses"); if(local) S.courses=local;
  renderHeader(); render();
  L("app_open",{data:{courses:Object.keys(S.courses).length, screen:innerWidth+"x"+innerHeight}});
  const c=window.claude;
  try{ const q=new URLSearchParams(location.search).get("signin"); if(q){ history.replaceState(null,"",location.pathname); toast(q==="ok"?"Signed in. Your courses now sync.":q==="unavailable"?"Sign-in isn't set up yet":"Sign-in didn't work. Try again."); L("signin_result",{data:{result:q}}); } }catch(e){}
  if(window.climbAuth){ try{ ME = await window.climbAuth.me(); }catch(e){} if(S.view==="today"||S.view==="you") render(); }
  if(!c||!c.use) return;
  const [db,user,sample]=await Promise.all([c.use("db"),c.use("user"),c.use("sample")]);
  S.sample=sample;
  if(sample){ try{ const l=await sample.limits(); S.imagesOk=!!(l&&l.images); }catch(e){} }
  const id = user ? await user.id() : null;
  if(db && id){
    S.db=db; S.uid=id;
    try{
      const [ps,qs]=await Promise.all([base().get(), base().collection("courses").get()]);
      S.store="db";
      if(ps.exists){ const rp=ps.data()||{}; const lp=S.profile; S.profile={...lp,...rp, xp:Math.max(lp.xp||0, rp.xp||0)}; } else saveProfile();
      const remote={}; qs.docs.forEach(d=>{ remote[d.id]=JSON.parse(JSON.stringify(d.data())); });
      const newer=Object.values(S.courses).filter(x=>!remote[x.id] || (x.updated||0) > (remote[x.id].updated||0));
      S.courses={...remote}; newer.forEach(saveCourse);
      lsSet("climb_courses", JSON.parse(JSON.stringify(S.courses)));
      if(newer.length) L("sync_merged",{data:{uploaded:newer.length}});
      if(S.cur && S.courses[S.cur.id] && !LS) S.cur=S.courses[S.cur.id];
    }catch(e){}
  }
  renderHeader();
  if(S.view==="home"||S.view==="course") render();
}
function fitScreen(){
  try{
    const touch = matchMedia("(pointer:coarse)").matches, w = window.innerWidth;
    const z = touch && w>=440 && w<1024 ? Math.min(2.2, w/420) : 1;
    document.documentElement.style.zoom = z===1 ? "" : z.toFixed(3);
  }catch(e){}
}
fitScreen(); let wasWide=isWide(); window.addEventListener("resize", ()=>{ clearTimeout(fitScreen.t); fitScreen.t=setTimeout(()=>{ fitScreen(); const w=isWide(); if(w!==wasWide){ wasWide=w; if(S.view==="map"||S.view==="field") render(); } else if(S.view==="map" && S.cur) drawLinks(S.cur); },150); });
boot();
})();
