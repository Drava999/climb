/* ---------- helpers ---------- */
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function uidGen(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an)\b/g," ").replace(/\s+/g," ").trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function similar(guess, targets){
  const g = norm(guess); if(!g) return false;
  return targets.filter(Boolean).some(t=>{ const n=norm(t); if(!n) return false;
    if(g===n) return true;
    if(n.length<=40 && 1-lev(g,n)/Math.max(g.length,n.length) >= .8) return true;
    if(n.length>40){ const keys=n.split(" ").filter(w=>w.length>4); const hit=keys.filter(w=>g.includes(w)).length; return keys.length && hit/keys.length>=.6; }
    return false; });
}

function newConcept(id,o){ return {id, name:String(o.name||""), summary:String(o.summary||""), points:Array.isArray(o.points)?o.points.filter(Boolean).map(String).slice(0,4):[], example:String(o.example||""), hook:String(o.hook||""), rung:0, s:0, due:0, seen:0, right:0, bank:null}; }
const order = c => c.units.flatMap(u=>u.concepts).filter(id=>c.concepts[id]);
function progress(c){ const ids=order(c); if(!ids.length) return 0; return Math.round(ids.reduce((s,id)=>s+c.concepts[id].rung,0)/(ids.length*5)*100); }
function accuracy(c){ const a=c.acc||[]; return a.length>=4 ? a.reduce((s,x)=>s+x,0)/a.length : null; }
function dueCount(c){ const now=Date.now(); return order(c).filter(id=>{const k=c.concepts[id]; return k.rung>0&&k.due<=now;}).length; }
function newCount(c){ return order(c).filter(id=>c.concepts[id].rung===0).length; }

function addUnits(c, units){
  (units||[]).forEach(u=>{ if(!u) return; const ids=[];
    (u.concepts||[]).forEach(k=>{ if(!k||!k.name) return; const id=uidGen(); c.concepts[id]=newConcept(id,k); ids.push(id); });
    if(ids.length) c.units.push({id:uidGen(), title:String(u.title||"Unit "+(c.units.length+1)), concepts:ids}); });
}

async function buildCourse(o){

LEARNER: ${levelText(o.level)}
GOAL OR CONTEXT: ${o.goal||"none given"}
${o.focus?`FOCUS: ${o.focus}. The whole course must be about this part of the topic specifically, going properly deep.`:o.scoped?"The learner chose a broad overview. Still make every concept specific and substantial.":""}
${o.notes?`SOURCE MATERIAL (base the course on this and stay faithful to it):\n"""${o.notes.slice(0,40000)}"""`:""}
${o.images.length?"Photos of notes are attached; use them as source material.":""}

Break it into 3 units of 4 concepts (12 concepts). Order them so each concept builds on the ones before it: core ideas first, then how it works, then application and nuance. Each concept is ONE learnable idea, not a chapter. Be accurate.
${qualityRules(o.level)}
Also suggest 5 "angles": other sides of this topic the learner could branch into later (2-5 words each), such as its history, real-world uses, the maths or science underneath, common myths, debates, or careers.
Return ONLY JSON: {"title": course title (max 5 words), "angles": ["",...], "units":[{"title": unit title (max 5 words), "concepts":[{"name": 1-5 words, "summary": plain-language explanation, max 45 words, defining any jargon, "points": 3 short key points (how or why it works, an important nuance, a common misconception), "example": one concrete example, max 30 words, "hook": a memory aid such as a mnemonic, acronym, vivid image or analogy, max 25 words}]}]}`;
  const {data:out, writer} = await writerJson(prompt, o.images.length && S.imagesOk ? {images:o.images} : {});
  const c = {id:uidGen(), writer, title:String((out&&out.title)||o.topic||"New course"), topic:o.topic, level:o.level, goal:o.goal, notes:(o.notes||"").slice(0,8000), created:Date.now(), acc:[], lessons:0, units:[], concepts:{}, angles:(out&&Array.isArray(out.angles)?out.angles:[]).filter(Boolean).map(String).slice(0,6)};
  addUnits(c, out&&out.units);
  if(!order(c).length) throw {message:"The course outline came back empty"};
  return c;
}

function prefetch(c){
  if(!S.sample) return;
  const ids = [...new Set([...buildLesson(c).all, ...order(c)])].filter(id=>needsBank(c.concepts[id]) && !inflight[id]).slice(0,3);
  if(ids.length) ensureBanks(c, ids).catch(()=>{});

  if(tids.length) ensureTeach(c, tids).catch(()=>{});
}
const refreshing = new Set();
function maybeRefresh(c, k, type){
  if(!S.sample || refreshing.has(k.id) || !k.bank) return;
  const used = k.used||{}, list = k.bank[type]||[];
  if(list.length && list.every(x=>(used[qkey(type,x)]||0)>=1)){
    refreshing.add(k.id);
    genBank(c, [k.id], true).catch(()=>{}).finally(()=>refreshing.delete(k.id));
  }
}
function pickVariant(k, type){
  const list = k.bank[type]; k.used = k.used||{};
  let cands = list.filter(x=>qkey(type,x)!==k.last); if(!cands.length) cands = list;
  const min = Math.min(...cands.map(x=>k.used[qkey(type,x)]||0));
  return shuffle(cands.filter(x=>(k.used[qkey(type,x)]||0)===min))[0];
}
function markUsed(k, type, x){ const key=qkey(type,x); k.used[key]=(k.used[key]||0)+1; k.last=key; }
async function addBranch(c, o){
  let ask;
  if(o.parent) ask = `Write a BRANCH that goes deeper into the concept "${o.parent.name}" (${o.parent.summary}). Break it into 4 more advanced sub-concepts: how it works in detail, special cases and limits, real applications, and subtleties an expert would know.`;
  else if(o.angle) ask = `Write a BRANCH that explores this side of the topic: "${o.angle}". 4 concepts that cover it properly and build on what the learner already knows.`;
  else ask = `Write the NEXT unit on the main route: 4 new concepts that build on these and go deeper or wider.`;
  const prompt = `You are extending a course called "${c.title}" for a learner who is a ${levelText(c.level)}${c.goal?" (goal: "+c.goal+")":""}.
Concepts already in the course: ${order(c).map(id=>c.concepts[id].name).join("; ")}.
${ask} Don't repeat existing concepts. Be accurate.
${qualityRules(c.level)}
Return ONLY JSON: {"title": unit title (max 5 words), "concepts":[{"name": 1-5 words, "summary": max 45 words, "points": 3 short key points (how or why it works, an important nuance, a common misconception), "example": max 30 words, "hook": memory aid, max 25 words}]}`;
  const {data:out} = await writerJson(prompt);
  const before = c.units.length; addUnits(c, [out]);
  if(c.units.length===before) throw {message:"No new concepts came back"};
  const u = c.units.pop();
  if(o.parent){ u.parent=o.parent.id; const pi=c.units.findIndex(x=>x.concepts.includes(o.parent.id)); c.units.splice(pi+1, 0, u); }
  else { if(o.angle){ u.angle=o.angle; c.angles=(c.angles||[]).filter(a=>a!==o.angle); } c.units.push(u); }
  if(o.parent||o.angle) c.focus=u.id;

}

/* ---------- lesson engine ---------- */
function buildLesson(c){
  const now=Date.now(), cons=order(c).map(id=>c.concepts[id]), a=accuracy(c);
  const nNew = a==null ? 3 : a<.7 ? 1 : a>=.9 ? 4 : 3;
  const due = cons.filter(k=>k.rung>0 && k.due<=now).sort((x,y)=>x.due-y.due).slice(0,5);
  const fu = c.focus && c.units.find(u=>u.id===c.focus);
  const pool = cons.filter(k=>k.rung===0);
  const ordered = fu ? [...pool.filter(k=>fu.concepts.includes(k.id)), ...pool.filter(k=>!fu.concepts.includes(k.id))] : pool;
  const fresh = ordered.slice(0, due.length>=4 ? Math.min(nNew,2) : nNew);
  let rev = due, extra=false;
  if(!rev.length && !fresh.length){ rev = cons.slice().sort((x,y)=>x.rung-y.rung||x.due-y.due).slice(0,6); extra=true; }
  const steps=[], r=[...rev];
  fresh.forEach(k=>{ steps.push({t:"intro",cid:k.id}); steps.push({t:"q",cid:k.id}); if(r.length) steps.push({t:"q",cid:r.shift().id}); });
  r.forEach(k=>steps.push({t:"q",cid:k.id}));
  return {steps, fresh:fresh.map(k=>k.id), reviews:rev.length, extra, all:[...new Set([...fresh,...rev].map(k=>k.id))]};
}
function pickLevel(c,k){
  let L=Math.min(5,k.rung+1), stretch=false; const a=accuracy(c);
  if(a!=null && a>=.9 && k.rung>=1 && L<5 && Math.random()<.4){ L++; stretch=true; }
  return {L, stretch};
}
function visualType(k,L){
  const v=k.teach&&k.teach.visual; if(!v) return null;
  if(L===1 && ["flow","cycle","parts","curve","scale"].includes(v.type) && visItems(v).filter(x=>x.note&&x.note.length>8).length>=1 && visItems(v).length>=3) return "label";
  if(L===2){ if(["flow","cycle","scale","bars"].includes(v.type) && visItems(v).length>=3) return "order"; if(v.type==="compare") return "sort"; }
  return null;
}
function typeFor(k,L){
  const vt=visualType(k,L);
  if(vt && k.lastVq!==vt && Math.random()<.45) return vt;
  const b=normBank(k.bank);
  if(L>=5 && b.connect.length && S.sample) return "connect";
  if(L>=4 && b.apply.length) return "apply";
  if(L>=3 && b.recall.length) return "recall";
  if(L>=2 && b.cloze.length) return "cloze";
  if(L>=2 && b.recall.length) return "recall";
  if(b.tf.length && k.seen>0 && Math.random()<.4) return "tf";
  return "mcq";
}
function grade(c,k,L,out){
  const snap={rung:k.rung,s:k.s,due:k.due,seen:k.seen,right:k.right}, accCopy=(c.acc||[]).slice(), was=LS.touched.has(k.id);
  LS.touched.add(k.id); k.seen++;
  if(out==="right"){ k.right++; k.rung=Math.max(k.rung,L); }
  else if(out==="helped"){ k.rung=Math.max(k.rung,L-1); }
  else if(out==="wrong" && L<=k.rung+1){ k.rung=Math.max(0,k.rung-1); }
  if(out==="wrong") k.s=Math.max(.2,(k.s||.5)*.35);
  else if(!was) k.s = out==="right" ? (k.s?Math.min(120,k.s*2.5):1) : out==="helped" ? (k.s?k.s*1.3:.5) : (k.s||.5);
  k.due = Date.now()+k.s*DAY;
  c.acc = accCopy.concat(out==="right"?1:out==="wrong"?0:.5).slice(-12);
  return ()=>{ Object.assign(k,snap); c.acc=accCopy; if(!was) LS.touched.delete(k.id); };
}

  :`<p class="muted">You'll meet this one in a lesson soon. Learning it there first, then being tested, makes it stick better than reading ahead.</p>`}

  const close=()=>bg.remove();

/* ---------- lesson flow ---------- */
async function startLesson(){
  bar(""); main.classList.remove("lesson");
  const c=S.cur, plan=buildLesson(c);
  if(!plan.steps.length){ toast("Nothing to practise yet"); return; }
  const missing = S.sample ? plan.all.filter(id=>needsBank(c.concepts[id])) : plan.all.filter(id=>!c.concepts[id].bank);
  const teachNeed = S.sample ? plan.fresh.filter(id=>needsTeach(c.concepts[id])) : [];
  if(missing.length || teachNeed.length){
    if(!S.sample){ toast("Lessons need Claude access in this view"); return; }
    S.view="loading"; window.scrollTo(0,0);
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Preparing your lesson</h3></div><p class="small muted">Writing ${teachNeed.length?"mini-lessons, diagrams and ":""}questions. About 20 to 40 seconds.</p></div>`;
    try{ await Promise.all([ensureBanks(c, missing), ensureTeach(c, teachNeed).catch(()=>{})]); }
    catch(e){ main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't prepare the lesson</strong><span>${esc(aiErr(e))}</span></div><div class="row"><button class="btn" id="retry">Try again</button><button class="btn ghost" id="back">Back</button></div></div>`; $("retry").onclick=startLesson; $("back").onclick=()=>go("course"); return; }
  }
  if(c.example) saveCourse(c);
  LS = {c, steps:plan.steps, i:0, touched:new Set(), count:{}, retry:{}, fresh:new Set(plan.fresh), snap:Object.fromEntries(plan.all.map(id=>[id,c.concepts[id].rung])), xp:0, right:0, total:0, pending:null, q:null};
  S.view="lesson"; renderStep(); prefetch(c);
}
function quitLesson(home){
  if(LS){ if(LS.xp) addXp(LS.xp); saveCourse(LS.c); LS=null; }
  go(home?"home":"course");
}
function head(){
  const pct = Math.round(LS.i/Math.max(1,LS.steps.length)*100);
  return `<div class="lessonhead"><button class="x" id="quit" aria-label="Leave lesson">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="tiny muted num">${LS.right}/${LS.total}</span></div>`;
}
function chip(eff, stretch){

}
function wireQuit(){ $("quit").onclick=()=>quitLesson(false); }
function shortWhy(k){ return String(k.summary||"").split(/(?<=[.!?])\s+/)[0]; }
function renderStep(){

  const st=LS.steps[LS.i]; if(!st) return finishLesson();
  const k=LS.c.concepts[st.cid];

  normBank(k.bank);
  if(st.t==="intro") return renderIntro(k);
  const {L,stretch}=pickLevel(LS.c,k), type=typeFor(k,L), eff=TL[type];

  const ch=chip(eff, LS.q.stretch) + (k.writer?`<span class="tiny muted">Question by ${esc(k.writer)}</span>`:"");
  bar("");

function labelPool(k, v, ans){
  let pool = order(LS.c).filter(id=>id!==k.id).flatMap(id=>{ const t=LS.c.concepts[id].teach; return t&&t.visual ? visItems(t.visual).map(x=>x.label) : []; });

  if(pool.length<3) pool = pool.concat(visItems(v).map(x=>x.label).filter(x=>norm(x)!==norm(ans)));
  return [...new Set(pool)];
}

function renderOrderQ(ch, k){
  const v=k.teach.visual, isScale=v.type==="scale", isBars=v.type==="bars";

  let pool = shuffle(correct); let guard=0; while(pool.join("|")===correct.join("|") && guard++<5) pool=shuffle(correct);
  const picked=[];

    $("slots").innerHTML = picked.map((x,i)=>`<div class="slot ${ok||x===correct[i]?"ok":"no"}"><span class="n">${i+1}</span><span>${esc(x)}</span></div>`).join("");

  };

      else if(v==="partial") answered("helped", {answer:ans, partial:true, note:r.note});
      else answered("wrong", {answer:ans, guess:g, note:r&&r.note, why:shortWhy(k)});
    }catch(e){ if(LS && LS.q.x===x) answered("wrong", {answer:ans, guess:g, why:shortWhy(k)}); }
  };
  $("tform").onsubmit=e=>{ e.preventDefault(); submit(); };
  $("check").onclick=submit;
}
function renderConnect(ch, k, b){
  main.innerHTML = head()+`<div class="card pop">${ch}<div class="prompt">${gloss(b.q)}</div><p class="small muted">Answer in your own words. Two or three sentences is plenty.</p>
    <textarea id="cin" placeholder="Explain it…"></textarea><button class="linkbtn" id="cskip" type="button" style="align-self:flex-start">Skip this one</button><div id="fb"></div></div>`;
  bar(`<button class="btn block" id="cgo">Check my answer</button>`);
  wireQuit();
  $("cskip").onclick=()=>{ LS.i++; renderStep(); };
  const doCheck=async()=>{
    const txt=$("cin").value.trim(); if(txt.length<15){ toast("Write a little more first"); return; }
    $("cin").disabled=true; $("cskip").hidden=true;
    bar(`<button class="btn block" disabled><span class="spinner"></span> Marking your answer…</button>`);
    try{
      const r = await S.sample.json(`Mark a learner's open answer fairly but rigorously.
CONCEPT: ${k.name}: ${k.summary}
QUESTION: ${b.q}
KEY POINTS a strong answer covers: ${b.points.join("; ")}
LEARNER: ${levelText(LS.c.level)}
LEARNER'S ANSWER: ${txt}
Return ONLY JSON: {"score": 0-100, "pass": true if score >= 60, "good": one short sentence on what they got right, "missing": one short sentence on what was missing or wrong (empty string if nothing), "better": a strong answer in under 60 words}`, {modelTier:"default", cache:false});
      if(!LS) return;
      const pass=!!r.pass||(+r.score>=60);
      answered(pass?"right":"wrong", {title: pass?`Strong answer · ${r.score}/100`:`Not there yet · ${r.score}/100`, noAnsBox:true, extra:`${r.good?`<p class="small">✓ ${esc(r.good)}</p>`:""}${r.missing?`<p class="small">✕ ${esc(r.missing)}</p>`:""}${r.better?`<div class="vans"><span class="label">A strong answer</span><span style="font-weight:400">${esc(r.better)}</span></div>`:""}`});
    }catch(e){
      $("cin").disabled=false; $("cskip").hidden=false; toast(aiErr(e));
      bar(`<button class="btn block" id="cgo2">Try again</button>`); $("cgo2").onclick=doCheck;
    }
  };
  $("cgo").onclick=doCheck;
}
function xpFor(out, eff){ return out==="right" ? (eff>=5?20:eff>=4?15:10) : out==="helped" ? 5 : out==="lucky" ? 3 : 0; }
function verdictHead(out, o, q){
  const kind = out==="right" ? "ok" : out==="wrong" ? "no" : "part";
  const title = o.title || (out==="right" ? (q.stretch?"Correct, level skipped":"Correct") : out==="helped" ? (o.partial?"Partly right":"Right, with help") : out==="lucky" ? "Noted as a guess" : "Not quite");
  return {kind, html:`<div class="vhead"><span class="vicon">${{ok:"✓",no:"✕",part:"~"}[kind]}</span><span>${esc(title)}</span></div>`};
}
function answered(out, o){
  const q=LS.q; if(q.done) return; q.done=true;
  const k=q.k, before=k.rung;
  q.undo = grade(LS.c, k, q.eff, out);
  LS.total++; if(out==="right") LS.right++;
  q.xp = xpFor(out,q.eff); LS.xp += q.xp;
  LS.pending = {cid:k.id, out};
  const vh = verdictHead(out,o,q);
  const up = k.rung>before ? `<span class="up">↑ ${esc(k.name)} reached level ${k.rung} · ${LVN[k.rung]}</span>` : "";
  const ansBox = !o.noAnsBox && o.answer && (out!=="right" || o.showAns) ? `<div class="vans"><span class="label">Answer</span><span>${esc(o.answer)}</span></div>` : "";
  const why = o.note || o.why || "";
  $("fb").innerHTML = `<div class="verdict ${vh.kind} pop" id="verdict"><div id="vh">${vh.html}</div>${ansBox}${why?`<p class="small">${gloss(why)}</p>`:""}${o.extra||""}${up}
    ${out==="wrong"&&hookOf(k)?`<div class="hook"><span class="label">Memory hook</span><span>${esc(hookOf(k))}</span></div>`:""}
    <div class="vlinks">${out!=="right"&&k.teach&&k.teach.visual&&!["label","order","sort"].includes(q.type)?`<button class="linkbtn" id="pic" type="button">Show me the picture</button>`:""}${S.sample?`<button class="linkbtn" id="simpler" type="button">Explain simpler</button><button class="linkbtn" id="deeper" type="button">Explain in more depth</button>`:""}${o.canGuess?`<button class="linkbtn" id="guess" type="button">I guessed</button>`:""}${out==="wrong"&&o.guess?`<button class="linkbtn" id="mine" type="button">I was right</button>`:""}</div>
    <div id="deepOut"></div></div>`;
  const last = LS.i+1>=LS.steps.length && out!=="wrong" && !(LS.fresh.has(k.id)&&(LS.count[k.id]||0)<1);
  bar(`<button class="btn block" id="next">${last?"Finish lesson":"Continue"}</button>`);
  $("next").onclick=nextStep;
  try{ $("verdict").scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){}
  const g=$("guess"); if(g) g.onclick=()=>regrade("lucky","It'll come back sooner so you can lock it in.");
  const m=$("mine"); if(m) m.onclick=()=>regrade("right","Counted as correct.");
  const pic=$("pic"); if(pic) pic.onclick=()=>{ pic.remove(); const box=$("deepOut"); box.className="deep"; box.innerHTML=visualHtml(k.teach.visual,{hint:"Tap each part to review it."}); wireVisual(box, k.teach.visual); };
  const smp=$("simpler"); if(smp) smp.onclick=()=>{ smp.remove(); const box=$("deepOut"); box.className="deep"; box.innerHTML=`<span class="label">Simpler</span><div class="read" style="font-size:16px"></div>`; streamInto(box.lastElementChild, simplerPrompt(LS&&LS.c, k, q.text)); };
  const dp=$("deeper"); if(dp) dp.onclick=async()=>{
    dp.remove(); const box=$("deepOut"); box.className="deep";
    box.innerHTML=`<span class="label">Going deeper</span><div class="read" id="deepTxt" style="font-size:16px">Thinking…</div>`;
    const t=$("deepTxt");
    try{ await S.sample(`A learner studying "${LS?LS.c.title:""}" just answered a question about "${k.name}".
QUESTION: ${q.text}
${o.answer?"CORRECT ANSWER: "+o.answer:""}
CONCEPT: ${k.summary}
Explain this more deeply in under 130 words of plain language: why it's true, how it works underneath, and one non-obvious detail or real-world case that goes beyond the basics. No headings, no preamble.`, {modelTier:"default", onText:({text})=>{ t.textContent=text; }}); }
    catch(e){ t.textContent=aiErr(e); }
  };
}
function regrade(out, msg){
  const q=LS.q; q.undo();
  if(LS.pending.out==="right") LS.right--; LS.xp-=q.xp;
  q.undo = grade(LS.c, q.k, q.eff, out);
  if(out==="right") LS.right++;
  q.xp = xpFor(out,q.eff); LS.xp+=q.xp; LS.pending.out=out;
  const v=$("verdict"), vh=verdictHead(out,{},q);
  v.className="verdict "+vh.kind; $("vh").innerHTML=vh.html + `<p class="small">${esc(msg)}</p>`;
  ["guess","mine"].forEach(id=>{ const x=$(id); if(x) x.remove(); });
}
function nextStep(){
  const p=LS.pending; LS.pending=null;
  if(p){
    const k=LS.c.concepts[p.cid]; LS.count[p.cid]=(LS.count[p.cid]||0)+1;
    const at=Math.min(LS.steps.length, LS.i+3);
    const later=LS.steps.some((s,j)=>j>LS.i&&s.cid===p.cid&&s.t==="q");
    if((p.out==="wrong"||p.out==="lucky") && (LS.retry[p.cid]||0)<2 && !later){ LS.retry[p.cid]=(LS.retry[p.cid]||0)+1; LS.steps.splice(at,0,{t:"q",cid:p.cid}); }
    else if((p.out==="right"||p.out==="helped") && LS.fresh.has(p.cid) && LS.count[p.cid]<2 && k.rung<5 && !later){ LS.steps.splice(at,0,{t:"q",cid:p.cid}); }
  }
  LS.i++; saveCourse(LS.c); renderStep();
}
function finishLesson(){
  bar(""); main.classList.remove("lesson");
  const c=LS.c; c.lessons=(c.lessons||0)+1;
  const bonus=15; addXp(LS.xp+bonus); saveCourse(c);
  const climbed = Object.entries(LS.snap).map(([id,r])=>({k:c.concepts[id], from:r})).filter(x=>x.k&&x.k.rung>x.from);
  const pct = LS.total ? Math.round(LS.right/LS.total*100) : 0;
  const now=Date.now(), nextDue=order(c).map(id=>c.concepts[id]).filter(k=>k.rung>0&&k.due>now).map(k=>k.due).sort((a,b)=>a-b)[0];
  const nw=newCount(c), a=accuracy(c);
  const pace = a==null ? "" : a>=.9 ? "You're finding this easy, so the next lesson brings more new concepts and harder questions." : a<.7 ? "This is a tough patch, so the next lesson slows down: fewer new concepts, more practice." : "Good pace. You're in the sweet spot where learning sticks best.";
  const xp=LS.xp+bonus, s=S.profile.streak;
  LS=null; S.view="done"; window.scrollTo(0,0);
  main.innerHTML = `<div class="card pop"><span class="label">Lesson complete</span><h1>${pct>=85?"Strong climb":pct>=60?"Solid progress":"Good effort"}</h1>
    <div class="stats"><div><b>${pct}%</b><span>correct</span></div><div><b>+${xp}</b><span>XP</span></div><div><b>${s}</b><span>day streak</span></div></div>
    ${pace?`<p class="small">${pace}</p>`:""}
    <span class="label">Levelled up</span>
    ${climbed.length?`<div class="climbed">${climbed.map(x=>`<div><span style="min-width:0"><b>${esc(x.k.name)}</b><br><span class="small muted">Level ${x.from} → ${x.k.rung} · ${LVN[x.k.rung]}</span></span>${pips(x.k.rung)}</div>`).join("")}</div>`:`<p class="small muted">No level-ups this time. Missed concepts come back sooner, which is exactly how they stick.</p>`}
    <p class="small muted">${nw?`${nw} new concept${nw>1?"s":""} waiting. `:""}${nextDue?`Next review due ${ago(nextDue-now)}.`:""}</p>
    <div class="row"><button class="btn" id="again" style="flex:1">Next lesson</button><button class="btn ghost" id="toCourse" style="flex:1">Course map</button></div></div>`;
  $("again").onclick=()=>startLesson(); $("toCourse").onclick=()=>go("course");
}

/* ---------- boot ---------- */
async function boot(){
  const p=lsGet("climb_profile"); if(p) S.profile={...S.profile,...p};
  const local=lsGet("climb_courses"); if(local) S.courses=local;
  renderHeader(); render();
  const c=window.claude;
  if(!c||!c.use) return;
  const [db,user,sample]=await Promise.all([c.use("db"),c.use("user"),c.use("sample")]);
  S.sample=sample;
  if(sample){ try{ const l=await sample.limits(); S.imagesOk=!!(l&&l.images); }catch(e){} }
  const id = user ? await user.id() : null;
  if(db && id){
    S.db=db; S.uid=id;
    try{
      const [ps,qs]=await Promise.all([base().get(), base().collection("courses").get()]);
      S.store="db";
      if(ps.exists) S.profile={...S.profile,...ps.data()};
      const remote={}; qs.docs.forEach(d=>{ remote[d.id]=JSON.parse(JSON.stringify(d.data())); });
      const localOnly=Object.values(S.courses).filter(x=>!remote[x.id]);
      S.courses=remote; localOnly.forEach(saveCourse);
      if(S.cur && S.courses[S.cur.id] && !LS) S.cur=S.courses[S.cur.id];
    }catch(e){}
  }
  renderHeader();
  if(S.view==="home"||S.view==="course") render();
}
boot();
})();
</script>
