/* ===== v2 phone-first redesign (approved mockup) ===== */
:root{--warn:#C27A0E;--dot:#C9D3CC;--tabh:78px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#E9A93A;--dot:#3A4A41}}
:root[data-theme="dark"]{--warn:#E9A93A;--dot:#3A4A41}
header.top{display:none}
body{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:0}
.app{max-width:520px}
main{gap:14px}
.screen{display:flex;flex-direction:column;gap:16px;padding-bottom:calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}
.col{display:flex;flex-direction:column}
.card,.panel{background:var(--surface);border:0;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(20,32,26,.05)}
.btn{border-radius:16px;min-height:52px;font-size:17px}
.btn.sm{min-height:40px;border-radius:12px}
.btn.dark{background:var(--ink);color:var(--bg)}
.tophead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px}
.tophead h1{font-size:28px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--hook-bg);color:var(--hook-ink);padding:8px 12px;border-radius:999px;font-weight:700;font-size:15px;flex:none}
.eyebrow{font:700 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.upnext{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.upnext .ring text{fill:currentColor}.upnext .ring circle:first-child{stroke:rgba(255,255,255,.3)}.upnext .ring circle:last-child{stroke:currentColor}
.uptitle{font:800 22px/1.2 var(--ui)}.upsub{font-size:15px;opacity:.92}
.upchip{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.upbtn{background:var(--accent-ink);color:var(--accent-text);font-weight:800;font-size:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .upchip{background:rgba(0,0,0,.15)}}
.crow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:14px 16px;min-height:72px}
.cico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:20px}
.cico.lang{background:#FDE8D7;color:#A2470F}.cico.exam{background:var(--good-soft);color:var(--good)}
.cmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.cname{font-weight:700;font-size:16px;line-height:1.25}
.cbar{display:block;height:6px;border-radius:99px;background:var(--raise);overflow:hidden}.cbar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cst{font-size:13px;font-weight:600;color:var(--muted);flex:none}.cst.due{color:var(--accent-text);background:var(--accent-soft);padding:4px 8px;border-radius:8px;font-weight:700}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border:0;border-radius:20px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(21,32,26,.25)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:var(--muted);font:600 12px var(--ui)}
.tab.on{color:var(--accent-text);font-weight:800}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none}
.gbtn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.gsi{min-height:44px;display:flex;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats>div{background:var(--surface);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats b{font-size:22px}.stats span{font-size:12px;color:var(--muted);font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;padding:6px 0;min-height:48px;text-align:left}
.iconbtn{border:0;background:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;font-size:20px;font-weight:700}
.iconbtn.sm{width:36px;height:36px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:18px}
/* new course flow */
.flow{padding-bottom:120px}
.flowhead{display:flex;align-items:center;gap:10px;padding-top:6px}
.steps4{flex:1;display:grid;gap:6px}.steps4 i{height:6px;border-radius:99px;background:var(--line)}.steps4 i.on{background:var(--ink)}
.flowbody{gap:16px;padding-top:8px}
.flowbody h1{font-size:30px}
.pillchip{align-self:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.pick{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;min-height:68px}
.pick b{font-size:17px}.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pico{width:44px;height:44px;border-radius:12px;background:var(--raise);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.pick.on .pico{background:var(--accent);color:var(--accent-ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
/* map tab */
.maphead{display:flex;align-items:center;gap:6px;padding-top:4px}
.mtitle{font-size:18px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--raise);padding:4px;border-radius:12px}
.seg2 button{border:0;background:none;border-radius:9px;min-height:38px;font:700 15px var(--ui);color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mm{position:relative;height:min(460px,56vh);border-radius:22px;background:var(--surface);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mm svg{display:block;cursor:grab}
.mm .spoke{stroke:var(--line);stroke-width:2}.mm .spoke.hot{stroke:var(--accent);stroke-width:3}
.mm .xlink{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5;opacity:.7}
.mm .glow{fill:var(--accent);opacity:.22}
.mm .fbg{fill:var(--surface);stroke:var(--line);stroke-width:5}
.mm .fprog{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.mm .fnode{cursor:pointer}.mm .fnode.empty .fbg{stroke-dasharray:5 5;fill:var(--bg)}
.mm .fnode.sel .fbg{fill:var(--accent-soft);stroke:var(--accent)}
.mm .fnum{font:700 15px var(--mono);fill:var(--ink)}.mm .fnode.empty .fnum{fill:var(--muted);font-size:20px}
.mm .flabel{font:800 12.5px var(--ui);fill:var(--ink)}.mm .fstage{font:600 10.5px var(--ui);fill:var(--muted)}
.mm .fnext{font:800 10px var(--ui);fill:var(--accent);letter-spacing:.08em}
.mm .cnode rect{fill:var(--ink)}.mm .cnode text{font:800 13px var(--ui);fill:var(--bg)}
.mmzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mmadd{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:14px;border:2px dashed var(--muted);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}.legend i.dash{width:14px;height:0;border-radius:0;border-top:2px dashed var(--muted)}
.dock{background:var(--surface);border-radius:24px;padding:12px 18px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -4px 20px rgba(21,32,26,.06)}
.dock .grab{width:40px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.stagebars{display:grid;gap:5px}.sb{display:flex;flex-direction:column;gap:4px;min-width:0}
.sbt{display:block;height:6px;border-radius:99px;background:var(--raise);overflow:hidden}.sbt>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sb.done .sbt>i{background:var(--good)}.sb span:last-child{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb.cur span:last-child{color:var(--accent-text);font-weight:800}.sb.done span:last-child{color:var(--good);font-weight:700}
.clist>summary{color:var(--accent-text);font:700 14px var(--ui);padding:6px 0}
/* lessons */
.segbar{flex:1;display:grid;gap:4px}.segbar i{height:8px;border-radius:99px;background:var(--raise)}.segbar i.on{background:var(--accent)}.segbar i.cur{background:color-mix(in srgb,var(--accent) 45%,var(--raise))}
main.lesson .card{box-shadow:none;background:transparent;padding:4px 0}
main.lesson .opt{border-radius:16px;padding:16px;min-height:56px;font-size:17px}
main.lesson .prompt{font-size:22px}
main.lesson{padding-bottom:260px}
main.lesson .verdict{position:fixed;left:0;right:0;bottom:calc(var(--abar-h,84px) - 1px);z-index:19;max-height:52vh;overflow:auto;margin:0;border-radius:26px 26px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) 14px;box-shadow:0 -10px 30px rgba(21,32,26,.14);animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
body:has(main.lesson .verdict.ok) .actionbar,body:has(main.lesson .verdict.ok) main.lesson .verdict{background:var(--good-soft)}
body:has(main.lesson .verdict.no) .actionbar,body:has(main.lesson .verdict.no) main.lesson .verdict{background:var(--bad-soft)}
body:has(main.lesson .verdict.part) .actionbar,body:has(main.lesson .verdict.part) main.lesson .verdict{background:var(--hook-bg)}
body:has(main.lesson .verdict) .actionbar{border-top:0}
body:has(main.lesson .verdict.ok) .actionbar .btn{background:var(--good);color:#fff}
.actionbar{padding-top:12px}.actionbar .abin{max-width:520px;margin:0 auto}
@media (prefers-reduced-motion:reduce){main.lesson .verdict{animation:none}}
.term{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help;display:inline}
.term:hover{color:var(--accent-text)}
.vcap{margin-top:-6px}
.vcurve{width:100%;max-width:420px;height:auto;align-self:center}
.vcurve .ax{stroke:var(--line);stroke-width:2}
.vcurve .cl{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.vcurve .carea{fill:var(--accent-soft)}
.vcurve .axl{fill:var(--muted);font:600 11px var(--ui)}
.cm{cursor:pointer;outline:none}
.cm circle{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.cm text{fill:var(--ink);font:700 11px var(--mono)}
.cm.on circle{fill:var(--accent)} .cm.on text{fill:var(--accent-ink)}
.cm:focus-visible circle{stroke-width:4}
.vbars{display:flex;flex-direction:column;gap:6px}
.vbar{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:1.5px solid transparent;border-radius:10px;padding:6px 8px;text-align:left;font:600 14px/1.25 var(--ui)}
.vbar .bt{height:14px;background:var(--raise);border-radius:7px;overflow:hidden}
.vbar .bt i{display:block;height:100%;background:var(--accent);border-radius:7px}
.vbar .bv{font:600 13px var(--mono)}
.vbar.on{border-color:var(--accent);background:var(--accent-soft)}
.play{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent-text);border-radius:999px;padding:8px 12px;font:700 13px var(--ui);flex:none}
.play:hover{border-color:var(--accent)}
.litem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lt{font:700 22px/1.3 var(--ui)}
.lbig{font:700 32px/1.3 var(--ui);text-align:center}
.lr{color:var(--accent-text);font:600 15px/1.4 var(--ui)}
.lbig+.lr{text-align:center}
.lm{color:var(--muted);font-size:15px}
.lopt{font-size:20px;font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;align-items:center}
.tiles.pool{border:0;padding:0;min-height:0}
.tile{font:700 18px var(--ui);padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.tile.placed{border-color:var(--accent);background:var(--accent-soft)}
.lbubble{background:var(--raise);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dlg{display:flex;flex-direction:column;gap:8px}
.dline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--raise);border-radius:14px;padding:10px 12px;margin-right:24px}
.dline.b{margin-right:0;margin-left:24px;background:var(--accent-soft)}
.spk{font:700 12px var(--mono);color:var(--muted)}
.wsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.exambox{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--raise)}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.plan{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--ui);letter-spacing:.04em;color:var(--accent-text);background:var(--accent-soft);padding:4px 10px;border-radius:999px;align-self:flex-start}
.timer{font:600 14px var(--mono);color:var(--bad)}
@media (prefers-reduced-motion:reduce){.pop,.spinner,.bar>i{animation:none;transition:none}}
/* path */
.path{gap:14px}
.phead{display:flex;align-items:center;gap:10px;padding-top:6px}
.cswitch{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:var(--surface);border-radius:18px;padding:8px 12px;text-align:left;color:var(--ink);min-height:60px;box-shadow:0 1px 2px rgba(20,32,26,.05)}
.cswitch b{font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cswitch>svg:last-child{color:var(--muted);flex:none}.cring{flex:none;display:flex}
.playbtn{border:0;background:var(--accent);color:var(--accent-ink);width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.pnext{margin:-4px 4px 0}
.rail{display:flex;flex-direction:column}
.pstep{display:flex;gap:12px}
.pcol{width:32px;flex:none;display:flex;flex-direction:column;align-items:center}
.pnode{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 15px var(--ui);background:var(--surface);border:2.5px solid var(--line);color:var(--muted);flex:none}
.pnode.done{background:var(--good);border-color:var(--good);color:#fff}
.pnode.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.pline{flex:1;width:4px;border-radius:2px;background:var(--line);margin:4px 0;min-height:16px}
.pstep.done .pline{background:var(--good)}.pstep.now .pline{background:linear-gradient(var(--accent) 45%,var(--line) 45%)}
.pstep:last-child .pline{background:transparent}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:18px}
.pbody h3{font-size:16px;font-weight:800;padding-top:5px;margin:0}
.why{background:var(--accent-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.why.ahead{background:var(--surface);border:1.5px dashed var(--line)}
.whyh{display:flex;align-items:center;gap:6px;font:800 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.why.ahead .whyh{color:var(--muted)}
.uses{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.uchip{display:inline-flex;align-items:center;gap:4px;font-weight:700;background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 9px}
.uchip.ok{color:var(--good)}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptile{border:2px solid transparent;background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:7px;text-align:left;color:var(--ink);min-height:96px;box-shadow:0 1px 2px rgba(20,32,26,.05)}
.ttop{display:flex;justify-content:space-between;align-items:center;width:100%}
.fico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.fico.big{width:44px;height:44px;border-radius:12px}
.ptile.s-done .fico{background:var(--good-soft);color:var(--good)}
.ptile.s-empty .fico,.ptile.later .fico{background:var(--raise);color:var(--muted)}
.tname{font-size:14.5px;font-weight:700;line-height:1.25}
.tstat{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.tstat.here{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:3px 8px;text-transform:uppercase;letter-spacing:.04em;font-weight:800}
.tstat.done{color:var(--good)}
.ptile.s-here{border-color:var(--accent)}
.ptile.s-empty,.ptile.later{background:transparent;border:2px dashed var(--line);box-shadow:none}
.ptile.sel{border-color:var(--ink);box-shadow:0 6px 16px rgba(21,32,26,.14)}
.addf{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);background:none;border-radius:16px;min-height:52px;font:700 15px var(--ui);color:var(--muted)}
.tests h2{margin:0}
.testrow{display:flex;align-items:center;gap:12px;border:0;background:var(--bg);border-radius:16px;padding:12px;text-align:left;color:var(--ink);min-height:64px;width:100%}
.testrow:disabled{opacity:.6}
.tico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none}
.tico.dark{background:var(--ink);color:var(--bg)}.tico.good{background:var(--good-soft);color:var(--good)}
.swrow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left;color:var(--ink);min-height:64px;width:100%}
.swrow.on{border-color:var(--accent);background:var(--accent-soft)}.swrow.new{border-style:dashed;justify-content:flex-start}
.swtick{color:var(--accent-text);display:flex}
/* field page */
.fpage{gap:12px}
.fhead{display:flex;align-items:center;gap:10px}
.fhead h1{font-size:24px;margin:0;line-height:1.15}.fhead h2{margin:0}
.fcard{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.flinks{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:6px}
.fcolx{display:flex;flex-direction:column;gap:6px}
.fchip{border:0;border-radius:99px;padding:8px 10px;font:700 12.5px var(--ui);background:var(--raise);color:var(--ink);text-align:center;line-height:1.2}
.fchip.done{background:var(--good-soft);color:var(--good)}.fchip.here,.fchip.progress{background:var(--accent-soft);color:var(--accent-text)}
.fchip.empty,.fchip.ready{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.fme{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:10px 12px;font:800 13px var(--ui);white-space:nowrap}
.farr{color:var(--muted);font-weight:800}
.fnone{font-size:12px;color:var(--muted);text-align:center}

/* ---------- helpers ---------- */
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function norm(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an)\b/g," ").replace(/\s+/g," ").trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function similar(guess, targets){
  const g = norm(guess); if(!g) return false;
  return targets.filter(Boolean).some(t=>{ const n=norm(t); if(!n) return false;
    if(g===n) return true;
    if(n.length<=40 && 1-lev(g,n)/Math.max(g.length,n.length) >= .8) return true;
    if(n.length>40){ const keys=n.split(" ").filter(w=>w.length>4); const hit=keys.filter(w=>g.includes(w)).length; return keys.length && hit/keys.length>=.6; }
    return false; });
}

function accuracy(c){ const a=c.acc||[]; return a.length>=4 ? a.reduce((s,x)=>s+x,0)/a.length : null; }

/* ---------- generation ---------- */
function addUnits(c, units){
  (units||[]).forEach(u=>{ if(!u) return; const ids=[];
    (u.concepts||[]).forEach(k=>{ if(!k||!k.name) return; const id=uidGen(); c.concepts[id]=newConcept(id,k); ids.push(id); });
    if(ids.length) c.units.push({id:uidGen(), title:String(u.title||"Unit "+(c.units.length+1)), concepts:ids}); });
}

function qualityRules(level){ return `QUALITY RULES:

function buildLesson(c, only){
  const now=Date.now(), cons=order(c).filter(id=>!only||only.has(id)).map(id=>c.concepts[id]), a=accuracy(c);
  let nNew = a==null ? 3 : a<.7 ? 1 : a>=.9 ? 4 : 3;
  const pc = isExam(c) ? pacing(c) : null; if(pc && pc.days>0) nNew = Math.min(5, Math.max(nNew, pc.perDay));
  const due = cons.filter(k=>k.rung>0 && k.due<=now).sort((x,y)=>x.due-y.due).slice(0,5);
  const fu = c.focus && c.units.find(u=>u.id===c.focus);
  const pool = cons.filter(k=>k.rung===0);
  const ordered = fu ? [...pool.filter(k=>fu.concepts.includes(k.id)), ...pool.filter(k=>!fu.concepts.includes(k.id))] : pool;
  const fresh = ordered.slice(0, due.length>=4 ? Math.min(nNew,2) : nNew);
  let rev = due, extra=false;
  if(!rev.length && !fresh.length){ rev = cons.slice().sort((x,y)=>x.rung-y.rung||x.due-y.due).slice(0,6); extra=true; }
  const steps=[], r=[...rev];
  fresh.forEach(k=>{ steps.push({t:"intro",cid:k.id}); steps.push({t:"q",cid:k.id}); if(r.length) steps.push({t:"q",cid:r.shift().id}); });
  r.forEach(k=>steps.push({t:"q",cid:k.id}));
  return {steps, fresh:fresh.map(k=>k.id), reviews:rev.length, extra, all:[...new Set([...fresh,...rev].map(k=>k.id))]};
}
function pickLevel(c,k){
  let L=Math.min(5,k.rung+1), stretch=false; const a=accuracy(c);
  if(a!=null && a>=.9 && k.rung>=1 && L<5 && Math.random()<.4){ L++; stretch=true; }
  return {L, stretch};
}
function visualType(k,L){
  const v=k.teach&&k.teach.visual; if(!v) return null;
  if(v.type==="graph") return v.asks&&v.asks.length&&L>=2&&L<=4&&k.lastVq!=="graph" ? "graph" : null;
  if(v.type==="diagram"){ if(L===1 && v.parts.filter(x=>x.note&&x.note.length>8).length>=1 && v.parts.length>=3) return "label"; return L>=2&&L<=4&&v.parts.length>=3&&k.lastVq!=="dtap" ? "dtap" : null; }
  if(v.type==="timeline"){ if(L===1 && v.items.filter(x=>x.note&&x.note.length>8).length>=1) return "label"; return L>=2&&L<=3 ? "order" : null; }
  if(L===1 && ["flow","cycle","parts","curve","scale"].includes(v.type) && visItems(v).filter(x=>x.note&&x.note.length>8).length>=1 && visItems(v).length>=3) return "label";
  if(L===2){ if(["flow","cycle","scale","bars"].includes(v.type) && visItems(v).length>=3) return "order"; if(v.type==="compare") return "sort"; }
  return null;
}
function typeFor(k,L){
  if(isLang(LS.c) && k.lang) return langType(k,L);
  const vt=visualType(k,L);
  if(vt && k.lastVq!==vt && Math.random()<(vt==="graph"||vt==="dtap"?.6:vt==="order"&&["history","skill"].includes(LS.c.kind)?.65:.45)) return vt;
  const b=normBank(k.bank);
  if(L>=5 && b.connect.length && S.sample) return "connect";
  if(L>=4 && b.apply.length) return "apply";
  if(L>=3 && b.recall.length) return "recall";
  if(L>=2 && b.cloze.length) return "cloze";
  if(L>=2 && b.recall.length) return "recall";
  if(b.tf.length && k.seen>0 && Math.random()<.4) return "tf";

}
function grade(c,k,L,out){
  const snap={rung:k.rung,s:k.s,due:k.due,seen:k.seen,right:k.right}, accCopy=(c.acc||[]).slice(), was=LS.touched.has(k.id);
  LS.touched.add(k.id); k.seen++;
  if(out==="right"){ k.right++; k.rung=Math.max(k.rung,L); }
  else if(out==="helped"){ k.rung=Math.max(k.rung,L-1); }
  else if(out==="wrong" && L<=k.rung+1){ k.rung=Math.max(0,k.rung-1); }
  if(out==="wrong") k.s=Math.max(.2,(k.s||.5)*.35);
  else if(!was) k.s = out==="right" ? (k.s?Math.min(120,k.s*2.5):1) : out==="helped" ? (k.s?k.s*1.3:.5) : (k.s||.5);
  k.due = Date.now()+k.s*DAY;
  c.acc = accCopy.concat(out==="right"?1:out==="wrong"?0:.5).slice(-12);
  return ()=>{ Object.assign(k,snap); c.acc=accCopy; if(!was) LS.touched.delete(k.id); };
}

async function ensureFieldLinks(c){
  if(!hasMap(c) || c.linksDone || !S.sample || c.modules.length<3 || ensureFieldLinks.busy) return;
  ensureFieldLinks.busy=true;
  try{
    const out=await S.sample.json(`A course called "${c.title}" has these fields:\n${c.modules.map((m,i)=>`${i+1}. ${m.title}: ${m.desc}`).join("\n")}\nWhich fields build on knowledge from which other fields? List only strong, real dependencies, at most 2 per field.\nReturn ONLY JSON: {"links":[[field number, field number it builds on]]}`, {modelTier:"quick"});
    arrOf(out&&out.links).forEach(p=>{ if(!Array.isArray(p)) return; const a=c.modules[(parseInt(p[0])||0)-1], b=c.modules[(parseInt(p[1])||0)-1]; if(a&&b&&a!==b){ a.needs=[...new Set([...(a.needs||[]), b.id])].slice(0,3); } });
    c.linksDone=true; saveCourse(c); if((S.view==="map"||S.view==="field") && S.cur===c) render();
  }catch(e){} finally{ ensureFieldLinks.busy=false; }
}

function stairSvg(c, m){

  for(let i=0;i<n;i++){ const s=from+i, ks=modUnits(c,m).filter(u=>(u.stage||1)===s).flatMap(u=>u.concepts).map(id=>c.concepts[id]).filter(Boolean);
    const pct=ks.length?ks.reduce((t,k)=>t+Math.min(4,k.rung),0)/(ks.length*4):0, h=22+i*(64/Math.max(1,n-1)), x=i*(bw+gap), y=90-h;
    const done=ks.length&&ks.filter(k=>k.rung>=4).length/ks.length>=.8, cur=s===st&&!done, future=!ks.length;

    else if(done) bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="6" class="st-d"/><path d="M${(x+bw/2-8).toFixed(1)} ${(y+h/2).toFixed(1)}l5 5 9-10" class="st-ck"/>`;
    else { bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="6" class="st-b"/><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(6,bw*pct).toFixed(1)}" height="${h.toFixed(1)}" rx="6" class="st-p"/>${cur?`<text x="${(x+bw/2).toFixed(1)}" y="${(y+h/2+5).toFixed(1)}" text-anchor="middle" class="st-t${pct<.5?" dk":""}">${Math.round(pct*100)}%</text><circle cx="${(x+bw/2).toFixed(1)}" cy="${(y-12).toFixed(1)}" r="7" class="st-me"/>`:""}`; }
    labels.push(`<span class="${done?"d":cur?"c":""}">${esc(stageName(s))}</span>`); }
  return `<svg class="stair" viewBox="0 -24 ${W} 116" role="img" aria-label="Your climb in this field: now at ${esc(stageName(Math.max(1,st)))}">${bars}</svg><div class="stairl" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${labels.join("")}</div>`;
}

function radarSvg(sk){

async function onBuild(){
  const d=S.draft; d.topic=String(d.topic||"").trim(); d.goal=String(d.goal||"").trim(); d.notes=String(d.notes||"").trim(); d.uni=String(d.uni||"").trim();

  if(d.purpose==="uni" && d.uni && !d.goal) d.goal="University prep: "+d.uni;
  S.view="building"; window.scrollTo(0,0);
  let focus="", scoped=false, kind=null, syllabus=null;
  const examMode = d.purpose==="exam";
  if(examMode){ d.examName=String(d.examName||"").trim(); }
  if(examMode && SG_EXAM_KEYS.has(d.exam) && d.topic){ await loadReady(); const rd=findReady(d.exam, d.topic);
    if(rd){ syllabus=rd.syllabus; L("syllabus_found",{data:{exam:d.exam, subject:d.topic, code:syllabus.code, year:syllabus.year, ready:true, source:syllabus.source_url, topics:(syllabus.topics||[]).length}}); } }
  if(!syllabus && examMode && SG_EXAM_KEYS.has(d.exam) && d.topic && window.climbSyllabus){
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Finding the official syllabus</h3></div><p class="small muted">Searching SEAB for the ${esc(examLabel(d.exam))} ${esc(d.topic)} syllabus and reading it. This can take up to a minute the first time; after that it's instant.</p></div>`;
    try{
      const r = await window.climbSyllabus(d.exam, d.topic, d.examDate ? d.examDate.slice(0,4) : String(new Date().getFullYear()));
      syllabus = r.syllabus;
      L("syllabus_found",{data:{exam:d.exam, subject:d.topic, code:syllabus.code, year:syllabus.year, cached:!!r.cached, source:syllabus.source_url, topics:(syllabus.topics||[]).length}});
    }catch(e){ L("syllabus_failed",{data:{exam:d.exam, subject:d.topic, error:String(e&&e.message)}}); }
  }
  if(d.topic && !d.notes && !d.images.length){
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Looking at ${esc(d.topic)}</h3></div><p class="small muted">Working out what kind of subject this is${examMode?"":" and whether it needs narrowing down"}…</p></div>`;
    try{
      const sc = await scopeTopic(d);
      if(sc && KINDS.includes(sc.kind)) kind = sc.kind;
      if(!examMode && sc && sc.broad && Array.isArray(sc.options) && sc.options.length){
        const pick = await chooseFocus(d, sc);
        if(pick===null){ go("home"); return; }
        focus=pick; scoped=true; L("focus_chosen",{data:{topic:d.topic, choice:pick||"broad overview", options:(sc.options||[]).map(o=>o.title)}});
      }
    }catch(e){}
  }
  const steps=(a,b,extra)=>{ main.innerHTML=`<div class="card"><span class="label">Building your course</span><h2>${esc(d.topic||"Your notes")}</h2>${focus?`<p class="small muted">Focus: ${esc(focus)}</p>`:""}${syllabus?`<p class="small muted">Using the official SEAB syllabus ${esc(syllabus.code||"")}${syllabus.year?" ("+esc(syllabus.year)+")":""}${syllabus.checked?" · checked":""}.</p>`:examMode&&SG_EXAM_KEYS.has(d.exam)?`<p class="small muted">Couldn't find the official syllabus, so building from what Claude knows about this exam.</p>`:""}${kind?`<p class="small muted">${esc((PLANS[kind]||PLANS.general).label)} lesson plan</p>`:""}
    <ul class="steps"><li>${a?'<span class="done"></span>':'<div class="spinner"></div>'}<span>Mapping the topic into concepts</span></li><li>${b?'<span class="done"></span>':a?'<div class="spinner"></div>':'<span class="dot"></span>'}<span>Writing your first lesson</span></li></ul>
    ${extra||'<p class="small muted">This takes about 20 to 40 seconds.</p>'}</div>`; };
  steps(false,false);
  try{
    const c = await buildCourse({topic:d.topic, level:d.level, goal:d.goal, notes:d.notes, images:d.images, focus, scoped, kind, purpose:d.purpose, uni:d.purpose==="uni"?d.uni:"",
      exam: examMode ? {key:d.exam, label:examLabel(d.exam), subject:(syllabus&&syllabus.subject)||d.topic, name:d.examName, date:d.examDate, syllabus} : null});
    if(focus) c.focus_text=focus;
    L("course_built",{course:c.title, data:{topic:d.topic, level:d.level, goal:d.goal, focus, kind:c.kind, purpose:c.purpose, exam:c.exam?{key:c.exam.key, date:c.exam.date, code:c.exam.syllabus&&c.exam.syllabus.code}:null, language:c.language||null, hasNotes:!!d.notes, photos:d.images.length, writer:c.writer, units:c.units.map(u=>({title:u.title, concepts:u.concepts.map(id=>c.concepts[id].name)}))}});
    steps(true,false, `<div style="display:flex;flex-direction:column;gap:10px"><h3>${esc(c.title)}</h3>${c.units.map((u,i)=>`<div><span class="label">Unit ${i+1}</span><p class="small"><b>${esc(u.title)}</b>: <span class="muted">${u.concepts.map(id=>esc(c.concepts[id].name)).join(" · ")}</span></p></div>`).join("")}</div>`);
    saveCourse(c);
    const first=buildLesson(c);
    await Promise.all([ensureBanks(c, first.all).catch(()=>{}), ensureTeach(c, first.fresh).catch(()=>{}), planMap(c).catch(e=>L("map_failed",{course:c.title, data:{error:String(e&&e.message)}}))]);
    S.draft={topic:"",level:d.level,goal:"",notes:"",images:[],purpose:d.purpose,exam:d.exam,examName:"",examDate:""};
    S.cur=c; S.mapMode="map"; S.selField=null; go("map"); prefetch(c);
  }catch(e){
    main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't build the course</strong>${(L("course_build_failed",{data:{topic:d.topic, level:d.level}}),"")}<span>${esc(aiErr(e))}</span></div><button class="btn block" id="back">Back</button></div>`;
    $("back").onclick=()=>go("home");
  }
}

function stopHtml(k){

  const cls = k.rung>=5 ? "mastered" : k.rung>0 && k.due<=now ? "due started" : k.rung>0||k.seen>0 ? "started" : "";
  const st = k.rung>=5 ? "Mastered" : k.rung>0 && k.due<=now ? "Due for review" : k.rung>0 ? `Level ${k.rung} · ${LVN[k.rung]}` : k.seen>0 ? "Met it, keep going" : "Not started";
  return `<button class="stop ${cls}" data-id="${esc(k.id)}"><span class="node"></span><span style="min-width:0"><b>${esc(k.name)}</b><span class="st">${st}</span></span>${pips(k.rung)}</button>`;
}
function unitLabel(c,u,n){
  if(u.parent){ const p=c.concepts[u.parent]; return `Branch · deeper into ${esc(p?p.name:"a concept")}`; }

  return `Unit ${n}`;
}

async function startLesson(opts){

  }
  if(c.example) saveCourse(c);

/* numbers are checked in the app: same value within 1% (units and thousands separators ignored) */

  const nw=newCount(c), a=accuracy(c);
  const pace = a==null ? "" : a>=.9 ? "You're finding this easy, so the next lesson brings more new concepts and harder questions." : a<.7 ? "This is a tough patch, so the next lesson slows down: fewer new concepts, more practice." : "Good pace. You're in the sweet spot where learning sticks best.";
  const xp=LS.xp+bonus, s=S.profile.streak;
  LS=null; S.view="done"; window.scrollTo(0,0);
  const mpct = mock && mock.total ? Math.round(mock.marks/mock.total*100) : 0;
  main.innerHTML = `<div class="card pop"><span class="label">${mock?(mock.combined?"Combined test complete":"Mock test complete"):"Lesson complete"}</span><h1>${mock?`${mock.marks}/${mock.total} marks`:pct>=85?"Strong climb":pct>=60?"Solid progress":"Good effort"}</h1>
    ${mock?`<p class="small">${mpct}% of marks. ${mock.missed.length?`Worth revising: ${esc([...new Set(mock.missed)].join(", "))}. These come back sooner in your lessons.`:"Nothing dropped. Keep your lessons going to stay sharp."}</p>`:""}
    <div class="stats"><div><b>${mock?mpct:pct}%</b><span>${mock?"of marks":"correct"}</span></div><div><b>+${xp}</b><span>XP</span></div><div><b>${s}</b><span>day streak</span></div></div>
    ${pace?`<p class="small">${pace}</p>`:""}
    <span class="label">Levelled up</span>
    ${climbed.length?`<div class="climbed">${climbed.map(x=>`<div><span style="min-width:0"><b>${esc(x.k.name)}</b><br><span class="small muted">Level ${x.from} → ${x.k.rung} · ${LVN[x.k.rung]}</span></span>${pips(x.k.rung)}</div>`).join("")}</div>`:`<p class="small muted">No level-ups this time. Missed concepts come back sooner, which is exactly how they stick.</p>`}
    <p class="small muted">${nw?`${nw} new concept${nw>1?"s":""} waiting. `:""}${nextDue?`Next review due ${ago(nextDue-now)}.`:""}</p>
    <div class="row"><button class="btn" id="again" style="flex:1">Next lesson</button><button class="btn ghost" id="toCourse" style="flex:1">Your path</button></div></div>`;
  $("again").onclick=()=>startLesson(); $("toCourse").onclick=()=>go("course");
}

/* ---------- boot ---------- */
async function boot(){
  const p=lsGet("climb_profile"); if(p) S.profile={...S.profile,...p};
  const local=lsGet("climb_courses"); if(local) S.courses=local;
  renderHeader(); render();
  L("app_open",{data:{courses:Object.keys(S.courses).length, screen:innerWidth+"x"+innerHeight}});
  const c=window.claude;
  try{ const q=new URLSearchParams(location.search).get("signin"); if(q){ history.replaceState(null,"",location.pathname); toast(q==="ok"?"Signed in. Your courses now sync.":q==="unavailable"?"Sign-in isn't set up yet":"Sign-in didn't work. Try again."); L("signin_result",{data:{result:q}}); } }catch(e){}
  if(window.climbAuth){ try{ ME = await window.climbAuth.me(); }catch(e){} if(S.view==="today"||S.view==="you") render(); }
  if(!c||!c.use) return;
  const [db,user,sample]=await Promise.all([c.use("db"),c.use("user"),c.use("sample")]);
  S.sample=sample;
  if(sample){ try{ const l=await sample.limits(); S.imagesOk=!!(l&&l.images); }catch(e){} }
  const id = user ? await user.id() : null;
  if(db && id){
    S.db=db; S.uid=id;
    try{
      const [ps,qs]=await Promise.all([base().get(), base().collection("courses").get()]);
      S.store="db";
      if(ps.exists){ const rp=ps.data()||{}; const lp=S.profile; S.profile={...lp,...rp, xp:Math.max(lp.xp||0, rp.xp||0)}; } else saveProfile();
      const remote={}; qs.docs.forEach(d=>{ remote[d.id]=JSON.parse(JSON.stringify(d.data())); });
      const newer=Object.values(S.courses).filter(x=>!remote[x.id] || (x.updated||0) > (remote[x.id].updated||0));
      S.courses={...remote}; newer.forEach(saveCourse);
      lsSet("climb_courses", JSON.parse(JSON.stringify(S.courses)));
      if(newer.length) L("sync_merged",{data:{uploaded:newer.length}});
      if(S.cur && S.courses[S.cur.id] && !LS) S.cur=S.courses[S.cur.id];
    }catch(e){}
  }
  renderHeader();
  if(S.view==="home"||S.view==="course") render();
}
function fitScreen(){
  try{
    const touch = matchMedia("(pointer:coarse)").matches, w = window.innerWidth;
    const z = touch && w>=440 && w<1024 ? Math.min(2.2, w/420) : 1;
    document.documentElement.style.zoom = z===1 ? "" : z.toFixed(3);
  }catch(e){}
}
fitScreen(); let wasWide=isWide(); window.addEventListener("resize", ()=>{ clearTimeout(fitScreen.t); fitScreen.t=setTimeout(()=>{ fitScreen(); const w=isWide(); if(w!==wasWide){ wasWide=w; if(S.view==="map"||S.view==="field") render(); } else if(S.view==="map" && S.cur) drawLinks(S.cur); },150); });
boot();
})();
</script>
