/* ---------- lesson engine ---------- */
function buildLesson(c){
  const now=Date.now(), cons=order(c).map(id=>c.concepts[id]), a=accuracy(c);
  let nNew = a==null ? 3 : a<.7 ? 1 : a>=.9 ? 4 : 3;
  const pc = isExam(c) ? pacing(c) : null; if(pc && pc.days>0) nNew = Math.min(5, Math.max(nNew, pc.perDay));
  const due = cons.filter(k=>k.rung>0 && k.due<=now).sort((x,y)=>x.due-y.due).slice(0,5);
  const fu = c.focus && c.units.find(u=>u.id===c.focus);
  const pool = cons.filter(k=>k.rung===0);
  const ordered = fu ? [...pool.filter(k=>fu.concepts.includes(k.id)), ...pool.filter(k=>!fu.concepts.includes(k.id))] : pool;
  const fresh = ordered.slice(0, due.length>=4 ? Math.min(nNew,2) : nNew);
  let rev = due, extra=false;
  if(!rev.length && !fresh.length){ rev = cons.slice().sort((x,y)=>x.rung-y.rung||x.due-y.due).slice(0,6); extra=true; }
  const steps=[], r=[...rev];
  fresh.forEach(k=>{ steps.push({t:"intro",cid:k.id}); steps.push({t:"q",cid:k.id}); if(r.length) steps.push({t:"q",cid:r.shift().id}); });
  r.forEach(k=>steps.push({t:"q",cid:k.id}));
  return {steps, fresh:fresh.map(k=>k.id), reviews:rev.length, extra, all:[...new Set([...fresh,...rev].map(k=>k.id))]};
}
function pickLevel(c,k){
  let L=Math.min(5,k.rung+1), stretch=false; const a=accuracy(c);
  if(a!=null && a>=.9 && k.rung>=1 && L<5 && Math.random()<.4){ L++; stretch=true; }
  return {L, stretch};
}
function visualType(k,L){
  const v=k.teach&&k.teach.visual; if(!v) return null;
  if(L===1 && ["flow","cycle","parts","curve","scale"].includes(v.type) && visItems(v).filter(x=>x.note&&x.note.length>8).length>=1 && visItems(v).length>=3) return "label";
  if(L===2){ if(["flow","cycle","scale","bars"].includes(v.type) && visItems(v).length>=3) return "order"; if(v.type==="compare") return "sort"; }
  return null;
}
function typeFor(k,L){
  if(isLang(LS.c) && k.lang) return langType(k,L);
  const vt=visualType(k,L);
  if(vt && k.lastVq!==vt && Math.random()<(vt==="order"&&["history","skill"].includes(LS.c.kind)?.65:.45)) return vt;
  const b=normBank(k.bank);
  if(L>=5 && b.connect.length && S.sample) return "connect";
  if(L>=4 && b.apply.length) return "apply";
  if(L>=3 && b.recall.length) return "recall";
  if(L>=2 && b.cloze.length) return "cloze";
  if(L>=2 && b.recall.length) return "recall";
  if(b.tf.length && k.seen>0 && Math.random()<.4) return "tf";
  return "mcq";
}
function grade(c,k,L,out){
  const snap={rung:k.rung,s:k.s,due:k.due,seen:k.seen,right:k.right}, accCopy=(c.acc||[]).slice(), was=LS.touched.has(k.id);
  LS.touched.add(k.id); k.seen++;
  if(out==="right"){ k.right++; k.rung=Math.max(k.rung,L); }
  else if(out==="helped"){ k.rung=Math.max(k.rung,L-1); }
  else if(out==="wrong" && L<=k.rung+1){ k.rung=Math.max(0,k.rung-1); }
  if(out==="wrong") k.s=Math.max(.2,(k.s||.5)*.35);
  else if(!was) k.s = out==="right" ? (k.s?Math.min(120,k.s*2.5):1) : out==="helped" ? (k.s?k.s*1.3:.5) : (k.s||.5);
  k.due = Date.now()+k.s*DAY;
  c.acc = accCopy.concat(out==="right"?1:out==="wrong"?0:.5).slice(-12);
  return ()=>{ Object.assign(k,snap); c.acc=accCopy; if(!was) LS.touched.delete(k.id); };
}

/* language practice */
const LANGQ = new Set(["lhear","lsee","lpick","lbuild","ltype","llisten","lrespond","ltrans"]);
const tilesOf = s => s.tiles && s.tiles.length>=2 ? s.tiles : String(s.t).split(/\s+/).filter(Boolean);
function langType(k, L){
  const c=LS.c, sp=canSpeak(c), d=k.lang||{}, r=Math.random();
  const buildable = (d.sentences||[]).some(s=>tilesOf(s).length>=3);
  if(L<=1) return sp && r<.5 ? "lhear" : "lsee";
  if(L===2) return buildable && r<.55 ? "lbuild" : "lpick";
  if(L===3) return sp && (d.sentences||[]).length && r<.4 ? "llisten" : "ltype";
  if(L===4) return (d.respond||[]).length ? "lrespond" : buildable ? "lbuild" : "ltype";
  return (d.translate||[]).length ? "ltrans" : "ltype";
}
function pickItem(k){
  const items = k.items||[]; k.iseen = k.iseen||{};
  const min = Math.min(...items.map(x=>k.iseen[x.t]||0));
  const it = shuffle(items.filter(x=>(k.iseen[x.t]||0)===min))[0];
  k.iseen[it.t] = (k.iseen[it.t]||0)+1; return it;
}
function langChoice(ch, promptHtml, opts, correctKey, o){
  main.innerHTML = head()+`<div class="card pop">${ch}${promptHtml}<div class="opts">${opts.map((x,i)=>`<button class="opt" data-i="${i}">${x.html}</button>`).join("")}</div><div id="fb"></div></div>`;
  wireQuit();
  main.querySelectorAll(".opts .opt").forEach(btn=>btn.onclick=()=>{
    const ok = opts[+btn.dataset.i].key===correctKey;
    main.querySelectorAll(".opts .opt").forEach(x=>{ x.disabled=true; if(opts[+x.dataset.i].key===correctKey) x.classList.add("ok"); });
    if(!ok) btn.classList.add("no");
    if(o.after) o.after(ok);
    answered(ok?"right":"wrong", {answer:o.answer, why:o.why||"", canGuess:ok});
  });
}
function langTyped(ch, promptHtml, t, o){
  main.innerHTML = head()+`<div class="card pop">${ch}${promptHtml}<div id="hintArea"></div>
    <form id="tform" autocomplete="off"><input type="text" id="tin" placeholder="${esc(o.placeholder)}" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></form>
    <button type="button" class="linkbtn" id="idk" style="align-self:flex-start">I don't know</button><div id="fb"></div></div>`;
  bar(`<div class="row" style="flex-wrap:nowrap"><button class="btn ghost" id="hint">Hint</button><button class="btn" id="check" style="flex:1">Check</button></div>`);
  wireQuit();
  const inp=$("tin"); setTimeout(()=>inp.focus(),60);
  let busy=false;
  const lock = g => { const f=$("tform"); if(f) f.outerHTML = g ? `<div class="yours"><span class="label">You wrote</span><span>${esc(g)}</span></div>` : ""; const i=$("idk"); if(i) i.remove(); };
  const answerText = `${t.t}${t.r?" ("+t.r+")":""}`;
  $("hint").onclick=()=>{ LS.q.hint++; const src=t.r||t.t; $("hintArea").innerHTML=`<div class="fb info"><span class="label">Hint · first letters</span><span class="mask">${esc(src.split(/\s+/).map(w=>w[0]+"_".repeat(Math.max(0,[...w].length-1))).join("  "))}</span></div>`; $("hint").disabled=true; };
  $("idk").onclick=()=>{ if(busy) return; busy=true; lock(""); if(o.after) o.after(); answered("wrong", {answer:answerText, why:o.why||""}); };
  const submit = async ()=>{
    const el=$("tin"); if(busy||!el) return; const g=el.value.trim(); if(!g){ el.focus(); return; }
    busy=true; LS.q.typed=g; lock(g);
    if(langMatch(g, [t.t, t.r])){ if(o.after) o.after(); return answered(LS.q.hint?"helped":"right", {answer:answerText, showAns:true}); }
    if(!S.sample){ if(o.after) o.after(); return answered("wrong", {answer:answerText, guess:g}); }
    bar(`<button class="btn block" disabled><span class="spinner"></span> Checking your answer…</button>`);
    try{
      const r = await aiCheck(o.question, answerText, [], g);
      if(!LS || LS.q.k!==o.k) return;
      if(o.after) o.after();
      const v=r&&r.verdict;
      if(v==="correct") answered(LS.q.hint?"helped":"right", {answer:answerText, showAns:true, note:r.note});
      else if(v==="partial") answered("helped", {answer:answerText, partial:true, note:r.note});
      else answered("wrong", {answer:answerText, guess:g, note:r&&r.note});
    }catch(e){ if(LS) answered("wrong", {answer:answerText, guess:g}); }
  };
  $("tform").onsubmit=e=>{ e.preventDefault(); submit(); };
  $("check").onclick=submit;
}
function renderLangQ(ch, k, type){
  const c=LS.c, d=k.lang||{}, sp=canSpeak(c), lang=c.language.name;
  if(!(k.items||[]).length && ["lhear","lsee","lpick","ltype"].includes(type)) type = (d.sentences||[]).some(x=>tilesOf(x).length>=3) ? "lbuild" : (d.respond||[]).length ? "lrespond" : "ltrans";
  const all = order(c).flatMap(id=>c.concepts[id].items||[]);
  const allSent = order(c).flatMap(id=>(c.concepts[id].lang&&c.concepts[id].lang.sentences)||[]);
  const optHtml = x => `<span class="lopt">${esc(x.t)}</span>${x.r?`<br><span class="small muted">${esc(x.r)}</span>`:""}`;
  const others = (it, key, pool) => shuffle([...new Map(pool.filter(x=>x[key]!==it[key]).map(x=>[x[key],x])).values()]).slice(0,3);
  if(type==="lhear"||type==="lsee"){
    const it=pickItem(k), opts=shuffle([it, ...others(it,"m",all)]).map(x=>({key:x.m, html:esc(x.m)}));
    LS.q.text = `${it.t} = ?`;
    const p = type==="lhear"
      ? `<div class="prompt">What does this mean?</div><div class="row">${playBtn(it.t)}${playBtn(it.t,true)}<button class="linkbtn" id="rvb" type="button">Show the words</button></div><div id="rv" hidden>${showTR(it,true)}</div>`
      : `<div class="prompt">What does this mean?</div>${showTR(it,true)}${sp?`<div class="row" style="justify-content:center">${playBtn(it.t)}</div>`:""}`;
    langChoice(ch, p, opts, it.m, {answer:`${it.t}${it.r?" ("+it.r+")":""} = ${it.m}`, after:()=>{ const rv=$("rv"); if(rv) rv.hidden=false; if(sp) speak(c,it.t); }});
    const rvb=$("rvb"); if(rvb) rvb.onclick=()=>{ $("rv").hidden=false; rvb.remove(); L("help",{course:c.title, concept:k.name, data:{kind:"show_words"}}); };
    if(type==="lhear") setTimeout(()=>speak(c,it.t),350);
    return;
  }
  if(type==="lpick"){
    const it=pickItem(k), opts=shuffle([it, ...others(it,"t",all)]).map(x=>({key:x.t, html:optHtml(x)}));
    LS.q.text = `How do you say "${it.m}"?`;
    langChoice(ch, `<div class="prompt">How do you say “${esc(it.m)}”?</div>`, opts, it.t, {answer:`${it.t}${it.r?" ("+it.r+")":""}`, after:()=>{ if(sp) speak(c,it.t); }});
    return;
  }
  if(type==="llisten"){
    const s=shuffle(d.sentences)[0], opts=shuffle([s, ...others(s,"m",allSent)]).map(x=>({key:x.m, html:esc(x.m)}));
    LS.q.text = `Listen: ${s.t}`;
    langChoice(ch, `<div class="prompt">Listen. What did they say?</div><div class="row">${playBtn(s.t)}${playBtn(s.t,true)}</div><div id="rv" hidden>${showTR(s)}</div>`, opts, s.m, {answer:`${s.t}${s.r?" ("+s.r+")":""} = ${s.m}`, after:()=>{ $("rv").hidden=false; }});
    setTimeout(()=>speak(c,s.t),350);
    return;
  }
  if(type==="lrespond"){
    const r=shuffle(d.respond)[0], right=r.options[r.answer];
    const opts = shuffle(r.options).map(x=>({key:x.t, html:optHtml(x)}));
    LS.q.text = `${r.situation} | They say: ${r.line.t}`;
    const p = `<p class="small muted">${esc(r.situation)}</p><div class="lbubble"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0">${showTR(r.line)}</div>${sp?playBtn(r.line.t):""}</div><button class="linkbtn" id="lmB" type="button" style="align-self:flex-start">What did they say?</button><div class="lm" id="lmT" hidden>${esc(r.line.m)}</div></div><div class="prompt">What do you say?</div>`;
    langChoice(ch, p, opts, right.t, {answer:`${right.t}${right.r?" ("+right.r+")":""} = ${right.m}`, why:`They said: “${r.line.m}”.`, after:()=>{ $("lmT").hidden=false; if(sp) speak(c,right.t); }});
    if(sp) setTimeout(()=>speak(c,r.line.t),350);
    const lb=$("lmB"); if(lb) lb.onclick=()=>{ $("lmT").hidden=false; lb.remove(); };
    return;
  }
  if(type==="lbuild"){
    const s=shuffle(d.sentences.filter(x=>tilesOf(x).length>=3))[0] || d.sentences[0];
    const tiles=tilesOf(s), extra=shuffle(all.map(x=>x.t).filter(t=>!tiles.includes(t)&&t.length<=8)).slice(0, tiles.length>=5?1:2);
    let pool = shuffle([...tiles, ...extra].map((t,i)=>({t,i})));
    const placed = [];
    LS.q.text = `Build: ${s.m}`;

      $("built").innerHTML = placed.length ? placed.map((p,i)=>`<button type="button" class="tile placed" data-p="${i}">${esc(p.t)}</button>`).join("") : '<span class="small muted">Tap the words below in order</span>';
      $("tpool").innerHTML = pool.filter(p=>!placed.includes(p)).map(p=>`<button type="button" class="tile" data-i="${p.i}">${esc(p.t)}</button>`).join("");
      $("built").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ placed.splice(+b.dataset.p,1); draw(); });
      $("tpool").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ placed.push(pool.find(p=>p.i===+b.dataset.i)); draw(); });
      $("bcheck").disabled = !placed.length;
    };
    main.innerHTML = head()+`<div class="card pop">${ch}<div class="prompt">Say this in ${esc(lang)}:<br>“${esc(s.m)}”</div><div class="tiles" id="built"></div><div class="tiles pool" id="tpool"></div><div id="fb"></div></div>`;
    bar(`<button class="btn block" id="bcheck" disabled>Check</button>`);
    wireQuit(); draw();
    $("bcheck").onclick=()=>{
      const ok = langNorm(placed.map(p=>p.t).join("")) === langNorm(tiles.join(""));
      $("tpool").innerHTML=""; $("built").querySelectorAll("button").forEach(b=>b.disabled=true);
      if(sp) speak(c,s.t);
      answered(ok?"right":"wrong", {answer:`${s.t}${s.r?" ("+s.r+")":""}`, showAns:true, why: ok?"":`Correct order: ${tiles.join(" · ")}`});
    };
    return;
  }
  if(type==="ltrans"){
    const tr=shuffle(d.translate)[0];
    LS.q.text = `Translate: ${tr.m}`;
    langTyped(ch, `<div class="prompt">Say this in ${esc(lang)}:<br>“${esc(tr.m)}”</div>`, tr, {k, placeholder: c.language.roman?`Type in ${c.language.roman} or characters`:`Type in ${lang}`, question:`Translate into ${lang}: "${tr.m}". ${c.language.roman?c.language.roman+" without tone marks, or the native script, both count. ":""}Accept any natural, correct translation, not only the reference.`, after:()=>{ if(sp) speak(c,tr.t); }});
    return;
  }
  // ltype
  const it=pickItem(k);
  LS.q.text = `Type: ${it.m}`;
  langTyped(ch, `<div class="prompt">How do you say “${esc(it.m)}”?</div><p class="small muted">${c.language.roman?`Type it in ${esc(c.language.roman)}. Tone marks are optional.`:"Type it."}</p>`, it, {k, placeholder: c.language.roman?`Type in ${c.language.roman}`:"Type it", question:`Say "${it.m}" in ${lang}. ${c.language.roman?c.language.roman+" without tone marks, or the native script, both count.":""}`, after:()=>{ if(sp) speak(c,it.t); }});
}

/* ---------- exam mode ---------- */
const EXAMS = [["psle","PSLE"],["sec","SEC (from 2027)"],["olevel","O-Level"],["nalevel","N(A)-Level"],["ntlevel","N(T)-Level"],["alevel","A-Level"],["other","Other exam"]];
const SG_EXAM_KEYS = new Set(["psle","sec","olevel","nalevel","ntlevel","alevel"]);
/* Ready-made official syllabuses (public/syllabi.json): checked summaries of SEAB documents, used instantly instead of a live lookup. */
let READY=null;
async function loadReady(){ if(READY) return READY; try{ const r=await fetch("/syllabi.json",{cache:"no-cache"}); READY = r.ok ? await r.json() : {items:[]}; }catch(e){ READY={items:[]}; } return READY; }
const normSubj = t => String(t||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
function findReady(exam, topic){ if(!READY) return null; const n=normSubj(topic); if(!n) return null;
  return READY.items.find(x=>x.exam===exam && (normSubj(x.name)===n || x.aliases.some(a=>normSubj(a)===n))) || null; }
function readyFor(exam){ return READY ? READY.items.filter(x=>x.exam===exam) : []; }
const PURPOSES = [["everyday","Everyday use"],["exam","An exam"],["understand","Understanding"]];
const examLabel = k => (EXAMS.find(e=>e[0]===k)||[null,k])[1];
const isExam = c => !!(c && c.exam);
function daysTo(dateStr){ if(!dateStr) return null; const t=Date.parse(dateStr+"T09:00:00"); return isFinite(t) ? Math.ceil((t-Date.now())/DAY) : null; }
function examOutlineText(o){
  const e=o.exam, sy=e.syllabus;
  if(sy) return `EXAM: ${sy.exam||e.label} ${sy.subject||o.topic} (syllabus ${sy.code||"?"}, ${sy.year||""}).
OFFICIAL SYLLABUS (source: ${sy.source_url}). Topics in order:
${(sy.topics||[]).map((t,i)=>`${i+1}. ${t.title}: ${(t.outcomes||[]).join("; ")}`).join("\n")}
PAPERS: ${(sy.assessment||[]).map(p=>`${p.paper} (${p.duration||"?"}, ${p.marks||"?"} marks): ${p.format||""}`).join("; ")}
Build the course to cover this syllabus in its order: 4-6 units following the syllabus's own topic groupings, 4 concepts each. Every concept maps to specific learning outcomes above, at the depth the exam requires. Don't add material outside the syllabus.`;
  return `EXAM: ${e.label}${e.name?" ("+e.name+")":""}, ${o.topic}. No official syllabus was available, so follow the standard content and question style of this exam as closely as you can. Build 4-6 units of 4 concepts.`;
}
function examQuestionText(c){
  const e=c.exam, sy=e.syllabus, cw=(sy&&sy.command_words||[]).join(", ");
  return `EXAM STYLE: write questions the way ${e.label} ${(sy&&sy.subject)||e.subject||c.topic} papers ask them${cw?`, using the exam's command words (${cw})`:""}${sy&&sy.assessment&&sy.assessment.length?`. Papers: ${sy.assessment.map(p=>`${p.paper}: ${p.format||""}`).join("; ")}`:""}. For every "apply" and "connect" question add "marks" (1-6, as the exam would award them). For "connect", "points" is the mark scheme with one point per mark.`;
}
function pacing(c){
  const dl = daysTo(c.exam&&c.exam.date); if(dl==null) return null;
  const remain = newCount(c), study = Math.max(1, dl-14);
  return {days:dl, remain, perDay: Math.max(1, Math.ceil(remain/study))};
}

/* mock tests */
async function startMock(){
  const c=S.cur;
  const started = order(c).filter(id=>c.concepts[id].rung>0);
  const pool = started.length>=3 ? started : order(c).slice(0,6);
  const pick = shuffle(pool).slice(0,10);
  const missing = pick.filter(id=>needsBank(c.concepts[id]));
  if(missing.length){
    if(!S.sample){ toast("Mock tests need the server connection"); return; }
    S.view="loading"; window.scrollTo(0,0); bar("");
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Setting your mock test</h3></div><p class="small muted">Writing exam-style questions. About 30 seconds.</p></div>`;
    try{ await ensureBanks(c, missing); }
    catch(e){ main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't set the mock test</strong><span>${esc(aiErr(e))}</span></div><button class="btn ghost" id="back">Back</button></div>`; $("back").onclick=()=>go("course"); return; }
  }
  const steps = pick.filter(id=>c.concepts[id].bank).map(id=>({t:"q",cid:id}));
  LS = {c, steps, i:0, touched:new Set(), count:{}, retry:{}, fresh:new Set(), snap:Object.fromEntries(pick.map(id=>[id,c.concepts[id].rung])), xp:0, right:0, total:0, pending:null, q:null,
        mock:{end:Date.now()+steps.length*90000, marks:0, total:0, missed:[]}};
  LS.mock.timer = setInterval(()=>{
    if(!LS||!LS.mock){ return; }
    const left = LS.mock.end-Date.now(), el=$("mockT");
    if(el) el.textContent = left>0 ? `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,"0")}` : "0:00";
    if(left<=0){ toast("Time's up"); finishLesson(); }
  }, 1000);
  L("mock_start",{course:c.title, data:{questions:steps.length, minutes:Math.round(steps.length*1.5)}});
  S.view="lesson"; renderStep();
}

      : d.exam==="other" ? "Climb will follow this exam's usual content and question style."
      : items.length ? "Another subject? Type it above and Climb will look up the official SEAB syllabus (up to a minute the first time)."

  loadReady().then(drawReady);

async function onBuild(){
  const d=S.draft; d.topic=$("fTopic").value.trim(); d.goal=$("fGoal").value.trim(); d.notes=$("fNotes").value.trim();

  S.view="building"; window.scrollTo(0,0);
  let focus="", scoped=false, kind=null, syllabus=null;
  const examMode = d.purpose==="exam";
  if(examMode){ const en=$("fExamName"), ed=$("fExamDate"); if(en) d.examName=en.value.trim(); if(ed) d.examDate=ed.value; }
  if(examMode && SG_EXAM_KEYS.has(d.exam) && d.topic){ await loadReady(); const rd=findReady(d.exam, d.topic);
    if(rd){ syllabus=rd.syllabus; L("syllabus_found",{data:{exam:d.exam, subject:d.topic, code:syllabus.code, year:syllabus.year, ready:true, source:syllabus.source_url, topics:(syllabus.topics||[]).length}}); } }
  if(!syllabus && examMode && SG_EXAM_KEYS.has(d.exam) && d.topic && window.climbSyllabus){

    try{
      const r = await window.climbSyllabus(d.exam, d.topic, d.examDate ? d.examDate.slice(0,4) : String(new Date().getFullYear()));
      syllabus = r.syllabus;
      L("syllabus_found",{data:{exam:d.exam, subject:d.topic, code:syllabus.code, year:syllabus.year, cached:!!r.cached, source:syllabus.source_url, topics:(syllabus.topics||[]).length}});
    }catch(e){ L("syllabus_failed",{data:{exam:d.exam, subject:d.topic, error:String(e&&e.message)}}); }
  }
  if(d.topic && !d.notes && !d.images.length){
    main.innerHTML=`<div class="card"><div class="row"><div class="spinner"></div><h3>Looking at ${esc(d.topic)}</h3></div><p class="small muted">Working out what kind of subject this is${examMode?"":" and whether it needs narrowing down"}…</p></div>`;
    try{
      const sc = await scopeTopic(d);
      if(sc && KINDS.includes(sc.kind)) kind = sc.kind;
      if(!examMode && sc && sc.broad && Array.isArray(sc.options) && sc.options.length){
        const pick = await chooseFocus(d, sc);
        if(pick===null){ go("home"); return; }
        focus=pick; scoped=true; L("focus_chosen",{data:{topic:d.topic, choice:pick||"broad overview", options:(sc.options||[]).map(o=>o.title)}});
      }
    }catch(e){}
  }
  const steps=(a,b,extra)=>{ main.innerHTML=`<div class="card"><span class="label">Building your course</span><h2>${esc(d.topic||"Your notes")}</h2>${focus?`<p class="small muted">Focus: ${esc(focus)}</p>`:""}${syllabus?`<p class="small muted">Using the official SEAB syllabus ${esc(syllabus.code||"")}${syllabus.year?" ("+esc(syllabus.year)+")":""}${syllabus.checked?" · checked":""}.</p>`:examMode&&SG_EXAM_KEYS.has(d.exam)?`<p class="small muted">Couldn't find the official syllabus, so building from what Claude knows about this exam.</p>`:""}${kind?`<p class="small muted">${esc((PLANS[kind]||PLANS.general).label)} lesson plan</p>`:""}
    <ul class="steps"><li>${a?'<span class="done"></span>':'<div class="spinner"></div>'}<span>Mapping the topic into concepts</span></li><li>${b?'<span class="done"></span>':a?'<div class="spinner"></div>':'<span class="dot"></span>'}<span>Writing your first lesson</span></li></ul>
    ${extra||'<p class="small muted">This takes about 20 to 40 seconds.</p>'}</div>`; };
  steps(false,false);
  try{
    const c = await buildCourse({topic:d.topic, level:d.level, goal:d.goal, notes:d.notes, images:d.images, focus, scoped, kind, purpose:d.purpose,
      exam: examMode ? {key:d.exam, label:examLabel(d.exam), subject:(syllabus&&syllabus.subject)||d.topic, name:d.examName, date:d.examDate, syllabus} : null});
    if(focus) c.focus_text=focus;
    L("course_built",{course:c.title, data:{topic:d.topic, level:d.level, goal:d.goal, focus, kind:c.kind, purpose:c.purpose, exam:c.exam?{key:c.exam.key, date:c.exam.date, code:c.exam.syllabus&&c.exam.syllabus.code}:null, language:c.language||null, hasNotes:!!d.notes, photos:d.images.length, writer:c.writer, units:c.units.map(u=>({title:u.title, concepts:u.concepts.map(id=>c.concepts[id].name)}))}});
    steps(true,false, `<div style="display:flex;flex-direction:column;gap:10px"><h3>${esc(c.title)}</h3>${c.units.map((u,i)=>`<div><span class="label">Unit ${i+1}</span><p class="small"><b>${esc(u.title)}</b>: <span class="muted">${u.concepts.map(id=>esc(c.concepts[id].name)).join(" · ")}</span></p></div>`).join("")}</div>`);
    saveCourse(c);
    const first=buildLesson(c);
    await Promise.all([ensureBanks(c, first.all).catch(()=>{}), ensureTeach(c, first.fresh).catch(()=>{}), planMap(c).catch(e=>L("map_failed",{course:c.title, data:{error:String(e&&e.message)}}))]);
    S.draft={topic:"",level:d.level,goal:"",notes:"",images:[],purpose:d.purpose,exam:d.exam,examName:"",examDate:""};
    S.cur=c; go("course"); prefetch(c);
  }catch(e){
    main.innerHTML=`<div class="card"><div class="fb no"><strong>Couldn't build the course</strong>${(L("course_build_failed",{data:{topic:d.topic, level:d.level}}),"")}<span>${esc(aiErr(e))}</span></div><button class="btn block" id="back">Back</button></div>`;
    $("back").onclick=()=>go("home");
  }
}

function stopHtml(k){
  const now=Date.now();
  const cls = k.rung>=5 ? "mastered" : k.rung>0 && k.due<=now ? "due started" : k.rung>0||k.seen>0 ? "started" : "";
  const st = k.rung>=5 ? "Mastered" : k.rung>0 && k.due<=now ? "Due for review" : k.rung>0 ? `Level ${k.rung} · ${LVN[k.rung]}` : k.seen>0 ? "Met it, keep going" : "Not started";
  return `<button class="stop ${cls}" data-id="${esc(k.id)}"><span class="node"></span><span style="min-width:0"><b>${esc(k.name)}</b><span class="st">${st}</span></span>${pips(k.rung)}</button>`;
}
function unitLabel(c,u,n){
  if(u.parent){ const p=c.concepts[u.parent]; return `Branch · deeper into ${esc(p?p.name:"a concept")}`; }
  if(u.angle) return `Branch · ${esc(u.angle)}`;
  return `Unit ${n}`;
}

function fieldHtml(c, m, openId){
  const st=modStage(c,m), ks=modCons(c,m), pr=modProgress(c,m), units=modUnits(c,m);
  const open = m.id===openId;
  return `<details class="field" data-m="${esc(m.id)}"${open?" open":""}>
    <summary><span class="fh"><b>${esc(m.title)}</b><span class="small muted">${st?`${stageName(st)} · ${ks.length} concept${ks.length===1?"":"s"}`:"Not started"}</span></span><span class="fbar" aria-label="${pr}% climbed"><i style="width:${pr}%"></i></span></summary>
    <div class="fbody">
      ${m.desc?`<p class="small muted">${esc(m.desc)}</p>`:""}
      ${units.map(u=>`<div class="unit${u.parent?" branch":""}"><span class="label">${esc(stageName(u.stage||1))}${u.parent?" · branch":""}</span><h3>${esc(u.title)}</h3>${u.concepts.filter(id=>c.concepts[id]).map(id=>stopHtml(c.concepts[id])).join("")}</div>`).join("")}
      ${st ? `<div class="fact"><button class="btn soft" data-act="more" type="button"><span>More on this<small>same level</small></span></button><button class="btn" data-act="deeper" type="button"><span>Go deeper<small>to ${esc(stageName(st+1))}</small></span></button></div>
        ${stageReady(c,m)?"":`<p class="tiny muted">Tip: practise the ${esc(stageName(st))} concepts a little more first for the best results, but it's your call.</p>`}`
        : `<button class="btn soft block" data-act="open" type="button">Start this field</button>`}
    </div></details>`;
}
function mapHtml(c){
  const pl=planOf(c), mods=c.modules;
  const fu = c.focus && c.units.find(u=>u.id===c.focus);
  const nextNew = order(c).map(id=>c.concepts[id]).find(k=>k.rung===0);
  const openId = (fu&&fu.mod) || (nextNew && (c.units.find(u=>u.concepts.includes(nextNew.id))||{}).mod) || (mods[0]&&mods[0].id);
  const sugg = (c.angles||[]).filter(a=>!mods.some(m=>norm(m.title)===norm(a))).slice(0,6);
  return `<div class="card">
    <span class="plan">${esc(pl.label)} lesson plan</span>
    <div class="row" style="justify-content:space-between"><h2>Course map</h2><span class="small muted">${mods.length} fields · ${order(c).length} concepts</span></div>
    <p class="small muted">Every field grows as far as you want. <b>More on this</b> adds new ground at the same level; <b>Go deeper</b> takes it to the next stage: ${STAGES.join(" → ")} → beyond.</p>
    <div class="fields">${mods.map(m=>fieldHtml(c,m,openId)).join("")}</div>
  </div>
  <div class="card" id="fieldCard">
    <h2>Add a field</h2>
    <p class="small muted">Widen the course with a new area. It starts at Foundations and grows like the others.</p>
    ${sugg.length?`<div class="chips" id="fieldChips">${sugg.map((a,i)=>`<button class="chip" type="button" data-i="${i}">${esc(a)}</button>`).join("")}</div>`:""}
    <form class="row" id="fieldForm" autocomplete="off"><input type="text" id="fieldIn" placeholder="Any area, e.g. ship finance" style="flex:1 1 180px"><button class="btn sm" type="submit">Add</button></form>
    <button class="linkbtn" id="suggestBtn" type="button">Suggest more fields</button>
    ${S.sample?"":`<p class="small muted">Growing the course needs Claude access in this view.</p>`}
  </div>`;
}
function wireMap(c){
  const busy = (el, txt) => { main.querySelectorAll(".fact button,[data-act],#fieldCard button,#fieldCard input").forEach(x=>x.disabled=true); if(el) el.innerHTML=`<span class="spinner"></span> ${esc(txt)}`; };
  const done = msg => { if(msg) toast(msg); renderCourse(); prefetch(c); };
  main.querySelectorAll(".field [data-act]").forEach(b=>{ if(!S.sample){ b.disabled=true; return; }
    b.onclick=async()=>{ const m=c.modules.find(x=>x.id===b.closest(".field").dataset.m), act=b.dataset.act;
      const st=modStage(c,m);
      busy(b, act==="deeper"?`Writing ${stageName(st+1)}…`:act==="more"?"Adding more…":"Starting this field…");
      try{ await expandField(c, m, act); done(act==="deeper"?`${m.title}: ${stageName(st+1)} added. Your next lesson starts it.`:"Added. Your next lesson starts it."); }
      catch(e){ toast(aiErr(e)); renderCourse(); } }; });
  main.querySelectorAll(".field").forEach(d=>d.addEventListener("toggle",()=>{ if(d.open) L("field_open",{course:c.title, data:{field:(c.modules.find(m=>m.id===d.dataset.m)||{}).title}}); }));
  const sugg=(c.angles||[]).filter(a=>!c.modules.some(m=>norm(m.title)===norm(a))).slice(0,6);
  const add = async (title, el) => { busy(el, `Adding ${title}…`); try{ await addField(c, title); done(`${title} added. Your next lesson starts it.`); }catch(e){ toast(aiErr(e)); renderCourse(); } };
  main.querySelectorAll("#fieldChips .chip").forEach(b=>b.onclick=()=>add(sugg[+b.dataset.i], b));
  const f=$("fieldForm"); f.onsubmit=e=>{ e.preventDefault(); const v=$("fieldIn").value.trim(); if(!v){ $("fieldIn").focus(); return; } add(v, f.querySelector("button")); };
  const sb=$("suggestBtn"); sb.onclick=async()=>{ sb.disabled=true; sb.textContent="Thinking of more fields…"; try{ await suggestFields(c); }catch(e){ toast(aiErr(e)); } renderCourse(); setTimeout(()=>{ const fc=$("fieldCard"); if(fc) fc.scrollIntoView({block:"center"}); },50); };
  if(!S.sample) main.querySelectorAll("#fieldCard button,#fieldCard input").forEach(x=>x.disabled=true);
}
function sheet(c, k){
  const met = k.seen>0 || k.rung>0;
  const kids = c.units.filter(u=>u.parent===k.id);
  const bg=document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet pop" role="dialog" aria-label="${esc(k.name)}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2>${esc(k.name)}</h2><button class="x" aria-label="Close">✕</button></div>
  ${met?`<div class="row" style="justify-content:space-between"><span class="small muted">Level ${k.rung} · ${LVN[k.rung]}</span>${pips(k.rung)}</div>
  ${k.items&&k.items.length?`<div>${k.items.map(it=>itemHtml(c,it)).join("")}</div>${k.note?`<div class="hook"><span class="label">Good to know</span><span>${esc(k.note)}</span></div>`:""}`:""}
  ${k.teach&&k.teach.eli5?`<p class="eli5" style="font-size:18px">${gloss(k.teach.eli5, k.name)}</p>`:""}
  ${k.teach&&k.teach.visual?`<div id="sheetVis">${visualHtml(k.teach.visual)}</div>`:""}
  <p class="read">${esc(k.summary)}</p>
  ${k.points&&k.points.length?`<ul class="kp">${k.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}

      $("hintArea").innerHTML=`<span class="label">Pick one</span><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
      $("hintArea").querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
        const ok = opts[+btn.dataset.i]===ans;
        $("hintArea").querySelectorAll(".opt").forEach(o=>{ o.disabled=true; if(opts[+o.dataset.i]===ans) o.classList.add("ok"); });
        if(!ok) btn.classList.add("no");
        answered(ok?"helped":"wrong", {answer:ans, why:shortWhy(k), noAnsBox:true});
      });
    }
  };
  $("idk").onclick=()=>{ if(busy) return; busy=true; lock(""); answered("wrong", {answer:ans, why:shortWhy(k)}); };
  const submit = async ()=>{
    const el=$("tin"); if(busy||!el) return; const g=el.value.trim(); if(!g){ el.focus(); return; }
    busy=true; LS.q.typed=g; lock(g); $("hintArea").innerHTML="";
    if(similar(g,targets)) return answered(LS.q.hint?"helped":"right", {answer:ans, showAns:norm(g)!==norm(ans)});
    if(!S.sample) return answered("wrong", {answer:ans, guess:g, why:shortWhy(k)});
    bar(`<button class="btn block" disabled><span class="spinner"></span> Checking your answer…</button>`);
    try{
      const r = await aiCheck(cloze ? x.s : x.q, ans, accept, g);
      if(!LS || LS.q.x!==x) return;
      const v = r && r.verdict;
      if(v==="correct") answered(LS.q.hint?"helped":"right", {answer:ans, showAns:true, note:r.note});
      else if(v==="partial") answered("helped", {answer:ans, partial:true, note:r.note});
      else answered("wrong", {answer:ans, guess:g, note:r&&r.note, why:shortWhy(k)});
    }catch(e){ if(LS && LS.q.x===x) answered("wrong", {answer:ans, guess:g, why:shortWhy(k)}); }
  };
  $("tform").onsubmit=e=>{ e.preventDefault(); submit(); };
  $("check").onclick=submit;
}
function renderConnect(ch, k, b){
  main.innerHTML = head()+`<div class="card pop">${ch}<div class="prompt">${gloss(b.q)}</div><p class="small muted">Answer in your own words. Two or three sentences is plenty.</p>
    <textarea id="cin" placeholder="Explain it…"></textarea><button class="linkbtn" id="cskip" type="button" style="align-self:flex-start">Skip this one</button><div id="fb"></div></div>`;
  bar(`<button class="btn block" id="cgo">Check my answer</button>`);
  wireQuit();
  $("cskip").onclick=()=>{ LS.i++; renderStep(); };
  const doCheck=async()=>{
    const txt=$("cin").value.trim(); if(txt.length<15){ toast("Write a little more first"); return; }
    $("cin").disabled=true; $("cskip").hidden=true;
    bar(`<button class="btn block" disabled><span class="spinner"></span> Marking your answer…</button>`);
    try{
      const r = await S.sample.json(`Mark a learner's open answer fairly but rigorously.
CONCEPT: ${k.name}: ${k.summary}
QUESTION: ${b.q}
KEY POINTS a strong answer covers: ${b.points.join("; ")}
LEARNER: ${levelText(LS.c.level)}
LEARNER'S ANSWER: ${txt}
${isExam(LS.c)?`Mark it like a ${LS.c.exam.label} ${LS.c.exam.subject||LS.c.topic} examiner, out of ${b.marks||b.points.length||3} marks, one mark per mark-scheme point clearly made. Include "marks_awarded".`:""}
Return ONLY JSON: {"score": 0-100, "pass": true if score >= 60, "marks_awarded": number, "good": one short sentence on what they got right, "missing": one short sentence on what was missing or wrong (empty string if nothing), "better": a strong answer in under 60 words}`, {modelTier:"default", cache:false});
      if(!LS) return;
      const pass=!!r.pass||(+r.score>=60);
      const mTot = b.marks||b.points.length||3, mGot = Math.max(0, Math.min(mTot, parseInt(r.marks_awarded)||0));
      if(LS.q) LS.q.marksAwarded = isExam(LS.c) ? mGot : null;
      answered(pass?"right":"wrong", {title: isExam(LS.c) ? `${mGot}/${mTot} marks` : pass?`Strong answer · ${r.score}/100`:`Not there yet · ${r.score}/100`, noAnsBox:true, extra:`${r.good?`<p class="small">✓ ${esc(r.good)}</p>`:""}${r.missing?`<p class="small">✕ ${esc(r.missing)}</p>`:""}${r.better?`<div class="vans"><span class="label">A strong answer</span><span style="font-weight:400">${esc(r.better)}</span></div>`:""}`});
    }catch(e){
      $("cin").disabled=false; $("cskip").hidden=false; toast(aiErr(e));
      bar(`<button class="btn block" id="cgo2">Try again</button>`); $("cgo2").onclick=doCheck;
    }
  };
  $("cgo").onclick=doCheck;
}
function xpFor(out, eff){ return out==="right" ? (eff>=5?20:eff>=4?15:10) : out==="helped" ? 5 : out==="lucky" ? 3 : 0; }
function verdictHead(out, o, q){
  const kind = out==="right" ? "ok" : out==="wrong" ? "no" : "part";
  const title = o.title || (out==="right" ? (q.stretch?"Correct, level skipped":"Correct") : out==="helped" ? (o.partial?"Partly right":"Right, with help") : out==="lucky" ? "Noted as a guess" : "Not quite");
  return {kind, html:`<div class="vhead"><span class="vicon">${{ok:"✓",no:"✕",part:"~"}[kind]}</span><span>${esc(title)}</span></div>`};
}
function answered(out, o){
  const q=LS.q; if(q.done) return; q.done=true;
  const k=q.k, before=k.rung;
  q.undo = grade(LS.c, k, q.eff, out);
  if(LS.mock){ const mk=(q.x&&q.x.marks)||(q.eff>=4?2:1); LS.mock.total+=mk; LS.mock.marks += q.marksAwarded!=null ? q.marksAwarded : out==="right"?mk : out==="helped"?Math.floor(mk/2) : 0; if(out!=="right") LS.mock.missed.push(k.name); }
  L("answer",{course:LS.c.title, concept:k.name, data:{type:q.type, level:q.eff, stretch:q.stretch, hints:q.hint, question:q.text, answer:o.answer||null, typed:q.typed||null, outcome:out, partial:!!o.partial, note:o.note||null, rungBefore:before, rungAfter:k.rung, writer:k.writer||null}});
  LS.total++; if(out==="right") LS.right++;
  q.xp = xpFor(out,q.eff); LS.xp += q.xp;
  LS.pending = {cid:k.id, out};
  const vh = verdictHead(out,o,q);
  const up = k.rung>before ? `<span class="up">↑ ${esc(k.name)} reached level ${k.rung} · ${LVN[k.rung]}</span>` : "";
  const ansBox = !o.noAnsBox && o.answer && (out!=="right" || o.showAns) ? `<div class="vans"><span class="label">Answer</span><span>${esc(o.answer)}</span></div>` : "";
  const why = o.note || o.why || "";
  $("fb").innerHTML = `<div class="verdict ${vh.kind} pop" id="verdict"><div id="vh">${vh.html}</div>${ansBox}${why?`<p class="small">${gloss(why)}</p>`:""}${o.extra||""}${up}
    ${out==="wrong"&&hookOf(k)?`<div class="hook"><span class="label">Memory hook</span><span>${esc(hookOf(k))}</span></div>`:""}
    <div class="vlinks"><button class="linkbtn" id="flag" type="button">Flag this question</button>${out!=="right"&&k.teach&&k.teach.visual&&!["label","order","sort"].includes(q.type)?`<button class="linkbtn" id="pic" type="button">Show me the picture</button>`:""}${S.sample?`<button class="linkbtn" id="simpler" type="button">Explain simpler</button><button class="linkbtn" id="deeper" type="button">Explain in more depth</button>`:""}${o.canGuess?`<button class="linkbtn" id="guess" type="button">I guessed</button>`:""}${out==="wrong"&&o.guess?`<button class="linkbtn" id="mine" type="button">I was right</button>`:""}</div>
    <div id="deepOut"></div></div>`;
  const last = LS.i+1>=LS.steps.length && out!=="wrong" && !(LS.fresh.has(k.id)&&(LS.count[k.id]||0)<1);
  bar(`<button class="btn block" id="next">${last?"Finish lesson":"Continue"}</button>`);
  $("next").onclick=nextStep;
  if(isLang(LS.c)) main.querySelectorAll(".card .lbig,.card .lt,.vans span:last-child").forEach(el=>{ if(!el.closest("button") && !el.querySelector("button")) el.innerHTML=langTap(LS.c, el.textContent); });
  try{ $("verdict").scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){}
  const g=$("guess"); if(g) g.onclick=()=>regrade("lucky","It'll come back sooner so you can lock it in.");
  const m=$("mine"); if(m) m.onclick=()=>regrade("right","Counted as correct.");
  const fl=$("flag"); if(fl) fl.onclick=()=>{ fl.outerHTML=`<span class="chips" id="flagChips">${["Confusing","Missing background","Answer is wrong","Too easy","Too hard","Uses words I don't know"].map(r=>`<button class="chip" type="button">${r}</button>`).join("")}</span>`; $("flagChips").querySelectorAll(".chip").forEach(c2=>c2.onclick=()=>{ L("flag",{course:LS&&LS.c.title, concept:k.name, data:{reason:c2.textContent, type:q.type, level:q.eff, question:q.text, answer:o.answer||null, outcome:out}}); $("flagChips").outerHTML='<span class="small muted">Thanks, noted. This helps improve the lessons.</span>'; }); };
  const pic=$("pic"); if(pic) pic.onclick=()=>{ L("help",{course:LS&&LS.c.title, concept:k.name, data:{kind:"picture", question:q.text}}); pic.remove(); const box=$("deepOut"); box.className="deep"; box.innerHTML=visualHtml(k.teach.visual,{hint:"Tap each part to review it."}); wireVisual(box, k.teach.visual); };
  const smp=$("simpler"); if(smp) smp.onclick=()=>{ L("help",{course:LS&&LS.c.title, concept:k.name, data:{kind:"simpler", question:q.text}}); smp.remove(); const box=$("deepOut"); box.className="deep"; box.innerHTML=`<span class="label">Simpler</span><div class="read" style="font-size:16px"></div>`; streamInto(box.lastElementChild, simplerPrompt(LS&&LS.c, k, q.text)); };
  const dp=$("deeper"); if(dp) dp.onclick=async()=>{ L("help",{course:LS&&LS.c.title, concept:k.name, data:{kind:"deeper", question:q.text}});
    dp.remove(); const box=$("deepOut"); box.className="deep";
    box.innerHTML=`<span class="label">Going deeper</span><div class="read" id="deepTxt" style="font-size:16px">Thinking…</div>`;
    const t=$("deepTxt");
    try{ await S.sample(`A learner studying "${LS?LS.c.title:""}" just answered a question about "${k.name}".
QUESTION: ${q.text}
${o.answer?"CORRECT ANSWER: "+o.answer:""}
CONCEPT: ${k.summary}
Explain this more deeply in under 130 words of plain language: why it's true, how it works underneath, and one non-obvious detail or real-world case that goes beyond the basics. No headings, no preamble.`, {modelTier:"default", onText:({text})=>{ t.textContent=text; }}); }
    catch(e){ t.textContent=aiErr(e); }
  };
}
function regrade(out, msg){
  L("regrade",{course:LS&&LS.c.title, concept:LS&&LS.q.k.name, data:{to:out, question:LS&&LS.q.text}});
  const q=LS.q; q.undo();
  if(LS.pending.out==="right") LS.right--; LS.xp-=q.xp;
  q.undo = grade(LS.c, q.k, q.eff, out);
  if(out==="right") LS.right++;
  q.xp = xpFor(out,q.eff); LS.xp+=q.xp; LS.pending.out=out;
  const v=$("verdict"), vh=verdictHead(out,{},q);
  v.className="verdict "+vh.kind; $("vh").innerHTML=vh.html + `<p class="small">${esc(msg)}</p>`;
  ["guess","mine"].forEach(id=>{ const x=$(id); if(x) x.remove(); });
}
function nextStep(){
  const p=LS.pending; LS.pending=null;
  if(p && !LS.mock){
    const k=LS.c.concepts[p.cid]; LS.count[p.cid]=(LS.count[p.cid]||0)+1;
    const at=Math.min(LS.steps.length, LS.i+3);
    const later=LS.steps.some((s,j)=>j>LS.i&&s.cid===p.cid&&s.t==="q");
    if((p.out==="wrong"||p.out==="lucky") && (LS.retry[p.cid]||0)<2 && !later){ LS.retry[p.cid]=(LS.retry[p.cid]||0)+1; LS.steps.splice(at,0,{t:"q",cid:p.cid}); }
    else if((p.out==="right"||p.out==="helped") && LS.fresh.has(p.cid) && LS.count[p.cid]<2 && k.rung<5 && !later){ LS.steps.splice(at,0,{t:"q",cid:p.cid}); }
  }
  LS.i++; saveCourse(LS.c); renderStep();
}
function finishLesson(){
  if(!LS) return;
  bar(""); main.classList.remove("lesson");
  const mock = LS.mock; if(mock && mock.timer) clearInterval(mock.timer);
  if(mock) L("mock_done",{course:LS.c.title, data:{marks:mock.marks, total:mock.total, answered:LS.total, of:LS.steps.length, missed:mock.missed}});
  const c=LS.c; c.lessons=(c.lessons||0)+1;
  L("lesson_done",{course:c.title, data:{right:LS.right, total:LS.total, xp:LS.xp, levels:Object.entries(LS.snap).map(([id,r])=>({concept:c.concepts[id]&&c.concepts[id].name, from:r, to:c.concepts[id]&&c.concepts[id].rung}))}});
  const bonus=15; addXp(LS.xp+bonus); saveCourse(c);
  const climbed = Object.entries(LS.snap).map(([id,r])=>({k:c.concepts[id], from:r})).filter(x=>x.k&&x.k.rung>x.from);
  const pct = LS.total ? Math.round(LS.right/LS.total*100) : 0;
  const now=Date.now(), nextDue=order(c).map(id=>c.concepts[id]).filter(k=>k.rung>0&&k.due>now).map(k=>k.due).sort((a,b)=>a-b)[0];
  const nw=newCount(c), a=accuracy(c);
  const pace = a==null ? "" : a>=.9 ? "You're finding this easy, so the next lesson brings more new concepts and harder questions." : a<.7 ? "This is a tough patch, so the next lesson slows down: fewer new concepts, more practice." : "Good pace. You're in the sweet spot where learning sticks best.";
  const xp=LS.xp+bonus, s=S.profile.streak;
  LS=null; S.view="done"; window.scrollTo(0,0);
  const mpct = mock && mock.total ? Math.round(mock.marks/mock.total*100) : 0;
  main.innerHTML = `<div class="card pop"><span class="label">${mock?"Mock test complete":"Lesson complete"}</span><h1>${mock?`${mock.marks}/${mock.total} marks`:pct>=85?"Strong climb":pct>=60?"Solid progress":"Good effort"}</h1>
    ${mock?`<p class="small">${mpct}% of marks. ${mock.missed.length?`Worth revising: ${esc([...new Set(mock.missed)].join(", "))}. These come back sooner in your lessons.`:"Nothing dropped. Keep your lessons going to stay sharp."}</p>`:""}
    <div class="stats"><div><b>${mock?mpct:pct}%</b><span>${mock?"of marks":"correct"}</span></div><div><b>+${xp}</b><span>XP</span></div><div><b>${s}</b><span>day streak</span></div></div>
    ${pace?`<p class="small">${pace}</p>`:""}
    <span class="label">Levelled up</span>
    ${climbed.length?`<div class="climbed">${climbed.map(x=>`<div><span style="min-width:0"><b>${esc(x.k.name)}</b><br><span class="small muted">Level ${x.from} → ${x.k.rung} · ${LVN[x.k.rung]}</span></span>${pips(x.k.rung)}</div>`).join("")}</div>`:`<p class="small muted">No level-ups this time. Missed concepts come back sooner, which is exactly how they stick.</p>`}
    <p class="small muted">${nw?`${nw} new concept${nw>1?"s":""} waiting. `:""}${nextDue?`Next review due ${ago(nextDue-now)}.`:""}</p>
    <div class="row"><button class="btn" id="again" style="flex:1">Next lesson</button><button class="btn ghost" id="toCourse" style="flex:1">Course map</button></div></div>`;
  $("again").onclick=()=>startLesson(); $("toCourse").onclick=()=>go("course");
}

/* ---------- boot ---------- */
async function boot(){
  const p=lsGet("climb_profile"); if(p) S.profile={...S.profile,...p};
  const local=lsGet("climb_courses"); if(local) S.courses=local;
  renderHeader(); render();
  L("app_open",{data:{courses:Object.keys(S.courses).length, screen:innerWidth+"x"+innerHeight}});
  const c=window.claude;
  if(!c||!c.use) return;
  const [db,user,sample]=await Promise.all([c.use("db"),c.use("user"),c.use("sample")]);
  S.sample=sample;
  if(sample){ try{ const l=await sample.limits(); S.imagesOk=!!(l&&l.images); }catch(e){} }
  const id = user ? await user.id() : null;
  if(db && id){
    S.db=db; S.uid=id;
    try{
      const [ps,qs]=await Promise.all([base().get(), base().collection("courses").get()]);
      S.store="db";
      if(ps.exists) S.profile={...S.profile,...ps.data()};
      const remote={}; qs.docs.forEach(d=>{ remote[d.id]=JSON.parse(JSON.stringify(d.data())); });
      const localOnly=Object.values(S.courses).filter(x=>!remote[x.id]);
      S.courses=remote; localOnly.forEach(saveCourse);
      if(S.cur && S.courses[S.cur.id] && !LS) S.cur=S.courses[S.cur.id];
    }catch(e){}
  }
  renderHeader();
  if(S.view==="home"||S.view==="course") render();
}
function fitScreen(){
  try{
    const touch = matchMedia("(pointer:coarse)").matches, w = window.innerWidth;
    const z = touch && w>=600 && w<1100 ? Math.min(1.4, Math.max(1, (w-32)/560)) : 1;
    document.documentElement.style.zoom = z===1 ? "" : z.toFixed(3);
  }catch(e){}
}
fitScreen(); window.addEventListener("resize", ()=>{ clearTimeout(fitScreen.t); fitScreen.t=setTimeout(fitScreen,150); });
boot();
})();
</script>
